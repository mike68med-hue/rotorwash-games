  c.restore();
  if (R.tilt) {
    // haze toward the horizon
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = R.T.theme.sky || '#9fc3dc', g = c.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, rgba(sky, 1)); g.addColorStop(0.55, rgba(sky, 0.45)); g.addColorStop(1, rgba(sky, 0));
    c.fillStyle = g; c.fillRect(0, 0, W, H * 0.5);
  }
  const wc = c;
  c = R.hud;
  c.setTransform(R.hdpr, 0, 0, R.hdpr, 0, 0); c.clearRect(0, 0, R.sw, R.sh);
  c.font = 'bold 11px Arial'; c.textAlign = 'center';
  for (const v of R.cars) {
    if (v.isPlayer || v.wrecked) continue;
    const [sxp, syp] = canvasToScreen((tf.a * v.x + tf.c * v.y + tf.e) / dpr, (tf.b * v.x + tf.d * v.y + tf.f) / dpr);
    if (sxp < -40 || sxp > R.sw + 40 || syp < -40 || syp > R.sh + 40) continue;
    const ty = syp - 34 * z * (R.tilt ? canvasScaleAt(syp) : 1);
    const hf = v.struct / v.structMax;
    c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(sxp - 22, ty + 3, 44, 4);
    c.fillStyle = hf > 0.5 ? '#7cd65a' : hf > 0.25 ? '#ffc24a' : '#ff5b4a'; c.fillRect(sxp - 22, ty + 3, 44 * hf, 4);
    const tag = v.ally ? '★ ' + v.name : v.name;
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(tag, sxp + 1, ty + 1);
    c.fillStyle = v.ally ? '#8fe388' : '#fff'; c.fillText(tag, sxp, ty);
  }
  if (aim) drawTargets(c, P, aim, (x, y) => canvasToScreen((tf.a * x + tf.c * y + tf.e) / dpr, (tf.b * x + tf.d * y + tf.f) / dpr), (x, y) => [(tf.a * x + tf.c * y + tf.e) / dpr, (tf.b * x + tf.d * y + tf.f) / dpr]);
  drawHUD(c, R.sw, R.sh);
}

// ---- Targeting help ------------------------------------------------------------------
// lock = the car your front guns will fire at right now (same rule the guns use);
// turret = what your turret is tracking; near = closest rival in range otherwise.
function aimInfo(P) {
  if (P.wrecked || P.finished) return null;
  const front = P.weapons.filter(w => w.mount === 'front' && w.def.cat !== 'guided');
  const range = Math.max(0, ...front.map(w => w.def.range));
  const [ox, oy] = rot(P.L / 2 + 3, 0, P.a);
  const assist = 0.15 + (P.acc.tgt ? 0.08 : 0) + 0.15;
  const lock = range ? findTarget(P, P.a, assist, range, P.x + ox, P.y + oy) : null;
  const tw = P.weapons.find(w => w.mount === 'turret');
  const turret = tw && tw.tgt && !tw.tgt.wrecked ? tw.tgt : null;
  const maxR = Math.max(range, ...P.weapons.map(w => w.def.range || 0));
  let near = null, nd = maxR;
  for (const o of R.cars) { if (!isEnemy(P, o) || o.wrecked || o === lock) continue; const d = Math.hypot(o.x - P.x, o.y - P.y); if (d < nd) { nd = d; near = o; } }
  return { range, lock, turret, near, nx: P.x + ox, ny: P.y + oy };
}
function drawAimLine(c, P, aim) {
  if (!aim.range) return;
  const ca = Math.cos(P.a), sa = Math.sin(P.a);
  c.save(); c.lineCap = 'round';
  if (aim.lock) {
    // locked: a solid red line to the target
    const t = aim.lock;
    c.strokeStyle = 'rgba(255,60,50,0.55)'; c.lineWidth = 3; c.setLineDash([14, 10]); c.lineDashOffset = -R.t * 60;
    c.beginPath(); c.moveTo(aim.nx, aim.ny); c.lineTo(t.x, t.y); c.stroke();
  } else {
    // not locked: a faint sight line showing where your guns point, to their range
    const g = c.createLinearGradient(aim.nx, aim.ny, aim.nx + ca * aim.range, aim.ny + sa * aim.range);
    g.addColorStop(0, 'rgba(255,255,255,0.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.strokeStyle = g; c.lineWidth = 2.5; c.setLineDash([10, 12]);
    c.beginPath(); c.moveTo(aim.nx, aim.ny); c.lineTo(aim.nx + ca * aim.range, aim.ny + sa * aim.range); c.stroke();
  }
  c.restore();
}
function drawTargets(c, P, aim, toScreen, toCanvas) {
  const k = R.tilt ? 0.85 : 1;
  const bracket = (v, col, size, label, pulse) => {
    const [x, y] = toScreen(v.x, v.y);
    if (x < -30 || x > R.sw + 30 || y < -30 || y > R.sh + 30) return false;
    const s = (size + (pulse ? Math.sin(R.t * 10) * 3 : 0)) * k, l = s * 0.45;
    c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath();
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { c.moveTo(x + sx * s, y + sy * s - sy * l); c.lineTo(x + sx * s, y + sy * s); c.lineTo(x + sx * s - sx * l, y + sy * s); }
    c.stroke();
    if (label) { c.font = 'bold 11px Arial'; c.textAlign = 'center'; c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(label, x + 1, y + s + 15); c.fillStyle = col; c.fillText(label, x, y + s + 14); }
    return true;
  };
  if (aim.near && aim.near !== aim.turret) bracket(aim.near, 'rgba(255,255,255,0.55)', 26, '', false);
  if (aim.turret && aim.turret !== aim.lock) bracket(aim.turret, '#ffb74d', 30, 'TURRET', false);
  if (aim.lock) bracket(aim.lock, '#ff3b30', 32, 'LOCKED', true);
  // arrows at the edge of the screen pointing to rivals you can't see
  const [px, py] = toCanvas(P.x, P.y), [psx, psy] = toScreen(P.x, P.y);
  for (const o of R.cars) {
    if (!isEnemy(P, o) || o.wrecked) continue;
    const d = Math.hypot(o.x - P.x, o.y - P.y);
    if (d > 2600) continue;
    const [sx, sy] = toScreen(o.x, o.y);
    if (sx > 10 && sx < R.sw - 10 && sy > 70 && sy < R.sh - 10) continue;
    const [cx, cy] = toCanvas(o.x, o.y), ang = Math.atan2(cy - py, cx - px);
    const rx = R.sw / 2 - 28, ry = R.sh * 0.42;
    const ax = R.sw / 2 + Math.cos(ang) * rx, ay = clamp(psy + Math.sin(ang) * ry, 150, R.sh * 0.6);   // stay above the driving controls
    const near = clamp(1 - d / 2600, 0.25, 1);
    c.save(); c.translate(ax, ay); c.rotate(ang);
    c.fillStyle = 'rgba(255,80,60,' + (0.35 + near * 0.55).toFixed(2) + ')';
    c.beginPath(); c.moveTo(14, 0); c.lineTo(-6, -9); c.lineTo(-2, 0); c.lineTo(-6, 9); c.closePath(); c.fill();
    c.restore();
  }
}
function canvasScaleAt(sy) { const t = R.tilt; const yr = sy - t.sh, u = yr * t.d / (t.c * t.d + yr * t.s); return t.d / (t.d - u * t.s); }

function drawHazard(c, h) {
  const fade = Math.min(1, h.life / 2);
  c.save(); c.globalAlpha = fade;
  switch (h.type) {
    case 'oil': {
      c.translate(h.x, h.y);
      const g = c.createRadialGradient(-6, -6, 2, 0, 0, h.r);
      g.addColorStop(0, 'rgba(70,60,90,0.95)'); g.addColorStop(0.5, 'rgba(15,12,18,0.92)'); g.addColorStop(1, 'rgba(10,10,10,0.0)');
      c.fillStyle = g;
      c.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283, r = h.r * (0.75 + 0.25 * Math.sin(i * 2.3 + h.seed * 9)); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill();
      c.fillStyle = 'rgba(120,180,255,0.15)'; c.beginPath(); c.ellipse(-8, -6, 9, 4, 0.6, 0, 6.3); c.fill();
      break; }
    case 'spk':
      c.translate(h.x, h.y); c.rotate(h.a);
      c.fillStyle = '#222'; c.fillRect(-h.r, -3, h.r * 2, 6);
      c.fillStyle = '#c9cdd1';
      for (let x = -h.r + 2; x < h.r; x += 5) { c.beginPath(); c.moveTo(x, -3); c.lineTo(x + 2.5, -7); c.lineTo(x + 5, -3); c.fill(); c.beginPath(); c.moveTo(x, 3); c.lineTo(x + 2.5, 7); c.lineTo(x + 5, 3); c.fill(); }
      break;
    case 'mine': {
      c.translate(h.x, h.y);
      c.fillStyle = '#3d4130'; c.beginPath(); c.arc(0, 0, 8, 0, 6.3); c.fill();
      c.strokeStyle = '#222'; c.lineWidth = 1.5; c.stroke();
      const blink = (h.t * 3) % 1 < 0.5;
      c.fillStyle = blink && h.t > 0.6 ? '#ff3030' : '#661010'; c.beginPath(); c.arc(0, 0, 2.6, 0, 6.3); c.fill();
      break; }
    case 'nap': {
      c.translate(h.x, h.y);
      const g = c.createRadialGradient(0, 0, 4, 0, 0, h.r);
      g.addColorStop(0, 'rgba(255,170,40,0.75)'); g.addColorStop(0.6, 'rgba(220,70,10,0.5)'); g.addColorStop(1, 'rgba(60,20,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, h.r, 0, 6.3); c.fill();
      break; }
  }
  c.restore();
}

function drawProj(c, p) {
  switch (p.k) {
    case 'bullet': {
      const l = p.heavy ? 0.022 : 0.016;
      c.strokeStyle = p.heavy ? '#ffe6a0' : '#fff2b8'; c.lineWidth = p.heavy ? 2.4 : 1.6;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * l, p.y - p.vy * l); c.stroke();
      break; }
    case 'shell':
      c.fillStyle = '#ffcf6b'; c.beginPath(); c.arc(p.x, p.y, 2.6, 0, 6.3); c.fill();
      c.strokeStyle = 'rgba(255,200,120,0.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); c.stroke();
      break;
    case 'rocket': case 'missile': case 'guided':
      c.save(); c.translate(p.x, p.y); c.rotate(p.a);
      c.fillStyle = p.k === 'missile' ? '#e0e0e0' : p.k === 'guided' ? '#e8e2d0' : '#7d8a5a'; rrect(c, -6, -1.8, 10, 3.6, 1.5); c.fill();
      c.fillStyle = '#c33'; c.beginPath(); c.moveTo(4, -1.8); c.lineTo(7, 0); c.lineTo(4, 1.8); c.fill();
      c.fillStyle = 'rgba(255,200,80,0.9)'; c.beginPath(); c.arc(-7, 0, 2.6, 0, 6.3); c.fill();
      c.restore(); break;
    case 'flame': {
      const t = 1 - p.life / p.max;
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(255,' + Math.floor(200 - t * 140) + ',40,' + (0.7 - t * 0.5).toFixed(2) + ')';
      c.beginPath(); c.arc(p.x, p.y, 4 + t * 12, 0, 6.3); c.fill();
      c.globalCompositeOperation = 'source-over';
      break; }
    case 'rail':
      c.strokeStyle = 'rgba(120,220,255,0.5)'; c.lineWidth = 5; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke();
      c.strokeStyle = '#fff'; c.lineWidth = 1.6; c.stroke();
      break;
  }
}

function drawParticles(c) {
  for (const p of R.parts) {
    const t = p.life / p.max;
    switch (p.type) {
      case 'smoke': c.fillStyle = 'rgba(180,180,180,' + (t * 0.45).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill(); break;
      case 'tiresmoke': c.fillStyle = 'rgba(225,225,225,' + (t * 0.3).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill(); break;
      case 'darksmoke': c.fillStyle = 'rgba(40,36,34,' + (t * 0.6).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill(); break;
      case 'dust': c.fillStyle = rgba(R.T.theme.ground2, (t * 0.5).toFixed(3)); c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill(); break;
      case 'fire':
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = 'rgba(255,' + Math.floor(120 + t * 120) + ',' + Math.floor(t * 60) + ',' + (t * 0.8).toFixed(3) + ')';
        c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill();
        c.globalCompositeOperation = 'source-over'; break;
      case 'nitro':
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = 'rgba(90,180,255,' + (t * 0.9).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, Math.max(1, p.size), 0, 6.3); c.fill();
        c.globalCompositeOperation = 'source-over'; break;
      case 'spark':
        c.strokeStyle = p.col; c.lineWidth = 1.3; c.globalAlpha = t;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.025, p.y - p.vy * 0.025); c.stroke(); c.globalAlpha = 1; break;
      case 'debris':
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = '#222'; c.fillRect(-p.size, -p.size / 2, p.size * 2, p.size); c.restore(); break;
      case 'flash':
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = 'rgba(255,230,150,0.9)'; c.beginPath(); c.arc(p.x, p.y, p.size * 0.6, 0, 6.3); c.fill();
        c.globalCompositeOperation = 'source-over'; break;
      case 'boomflash':
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = 'rgba(255,220,140,' + (t * 0.6).toFixed(3) + ')'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 6.3); c.fill();
        c.globalCompositeOperation = 'source-over'; break;
    }
  }
}

function drawHUD(c, W, H) {
  const P = R.player, T = R.T;
  syncRocketBtn();
  if (R.aim) {
    // armed: tell the player to tap the target
    c.fillStyle = 'rgba(255,143,31,0.12)'; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(0,0,0,0.6)'; rrect(c, W / 2 - 150, H * 0.36 - 22, 300, 44, 12); c.fill();
    c.fillStyle = '#ffb74d'; c.font = 'bold 17px Arial'; c.textAlign = 'center';
    c.fillText('TAP WHERE TO SEND THE ROCKET', W / 2, H * 0.36 + 6);
  }
  if (R.mode === 'race') {
  const st = standings();
  const pos = st.indexOf(P) + 1;
  // top-left panel
  c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, 8, 8, 118, 64, 10); c.fill();
  c.textAlign = 'left'; c.fillStyle = '#ffd54f'; c.font = 'bold 30px Arial Black, Arial';
  c.fillText(P.finished ? ordinal(P.place) : String(pos), 16, 42);
  c.font = 'bold 13px Arial'; c.fillStyle = '#fff';
  c.fillText(P.finished ? 'FINISHED' : '/ ' + R.cars.length, P.finished ? 70 : 46, 40);
  c.font = 'bold 13px Arial'; c.fillStyle = '#cfd8dc';
  c.fillText('LAP ' + clamp(P.lap, 1, R.laps) + '/' + R.laps, 16, 62);
  const tt = Math.max(0, R.t - R.goT);
  c.textAlign = 'right'; c.fillText(Math.floor(tt / 60) + ':' + String(Math.floor(tt % 60)).padStart(2, '0'), 118, 62);
  } else {
  // top-left panel: rivals still running + time left
  const rivalsLeft = R.cars.filter(v => isEnemy(P, v) && !v.wrecked).length;
  const alliesLeft = R.cars.filter(v => v.ally && !v.wrecked).length;
  c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, 8, 8, 118, 64, 10); c.fill();
  c.textAlign = 'left'; c.fillStyle = rivalsLeft ? '#ff8a65' : '#9ccc65'; c.font = 'bold 30px Arial Black, Arial';
  c.fillText(String(rivalsLeft), 16, 42);
  c.font = 'bold 11px Arial'; c.fillStyle = '#fff';
  c.fillText('RIVALS', 44, 29); c.fillText('LEFT', 44, 42);
  // no time limit: the clock counts up instead of down
  const noLimit = R.limit >= 1e8;
  const left = noLimit ? Math.max(0, R.t - R.goT) : Math.max(0, R.limit - Math.max(0, R.t - R.goT));
  c.font = 'bold 13px Arial'; c.fillStyle = !noLimit && left < 30 ? '#ff6e6e' : '#cfd8dc';
  c.fillText(R.teams ? 'ALLIES ' + alliesLeft : 'TIME', 16, 62);
  c.textAlign = 'right'; c.fillText(Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0'), 118, 62);
  }
  // damage diagram
  drawDamageDiagram(c, 14, 80, P);
  // weapons + ammo
  let y = 186;
  c.textAlign = 'left'; c.font = 'bold 11px Arial';
  for (const w of P.weapons) {
    c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, 8, y - 12, 118, 17, 6); c.fill();
    c.fillStyle = w.ammo > 0 ? '#fff' : '#ff6e6e';
    c.fillText((w.mount === 'turret' ? '⟳ ' : '') + (w.def.short || w.def.name), 14, y);
    c.textAlign = 'right'; c.fillText(w.ammo === Infinity ? '∞' : String(w.ammo), 120, y); c.textAlign = 'left';
    y += 20;
  }
  for (const d of P.droppers) {
    c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, 8, y - 12, 118, 17, 6); c.fill();
    c.fillStyle = d.uses > 0 ? '#ffe082' : '#ff6e6e';
    c.fillText(d.def.name, 14, y); c.textAlign = 'right'; c.fillText(String(d.uses), 120, y); c.textAlign = 'left';
    y += 20;
  }
  // minimap
  const mm = T.mm, ms = 112;
  c.save();
  c.fillStyle = 'rgba(0,0,0,0.45)'; rrect(c, W - ms - 8, 8, ms, ms, 10); c.fill();
  c.drawImage(mm.cv, W - ms - 8, 8, ms, ms);
  const f = ms / (mm.size * 2);
  for (const v of R.cars) {
    const x = W - ms - 8 + (v.x * mm.sc + mm.ox) * f, yy = 8 + (v.y * mm.sc + mm.oy) * f;
    if (v.wrecked) { c.fillStyle = '#555'; c.fillRect(x - 2, yy - 2, 4, 4); continue; }
    c.fillStyle = v.isPlayer ? '#fff' : v.car.color;
    c.beginPath(); c.arc(x, yy, v.isPlayer ? 4.2 : 3.2, 0, 6.3); c.fill();
    if (v.ally) { c.strokeStyle = '#8fe388'; c.lineWidth = 1.8; c.stroke(); }
    if (v.isPlayer) { c.strokeStyle = '#000'; c.lineWidth = 1.5; c.stroke(); }
  }
  c.restore();
  // nitro bar
  if (P.nitroT > 0) {
    c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, W / 2 - 60, 12, 120, 10, 5); c.fill();
    c.fillStyle = '#29b6f6'; rrect(c, W / 2 - 60, 12, 120 * P.nitroT / 2.6, 10, 5); c.fill();
  }
  // messages
  c.textAlign = 'center';
  let my = Math.max(150, H * 0.2);
  for (const m of R.msgs) {
    c.globalAlpha = Math.min(1, m.t * 2);
    c.font = 'bold 14px Arial';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(m.text, W / 2 + 1, my + 1);
    c.fillStyle = m.col; c.fillText(m.text, W / 2, my);
    my += 20;
  }
  c.globalAlpha = 1;
  // countdown
  const cdLeft = R.goT - R.t;
  if (cdLeft > -0.8) {
    const n = Math.ceil(cdLeft);
    const txt = cdLeft > 0 ? String(n) : R.mode === 'race' ? 'GO!' : 'FIGHT!';
    const ph = cdLeft > 0 ? cdLeft - Math.floor(cdLeft) : 1 + cdLeft / 0.8;
    c.save(); c.translate(W / 2, H * 0.36); c.scale(1 + ph * 0.5, 1 + ph * 0.5);
    c.font = 'bold 72px Arial Black, Arial';
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillText(txt, 3, 3);
    c.fillStyle = cdLeft > 0 ? '#ffd54f' : '#76ff03'; c.fillText(txt, 0, 0);
    c.restore();
    if (cdLeft > 0.5 && R.t < 1.6) {
      c.font = 'bold 15px Arial'; c.fillStyle = '#fff';
      c.fillText(T.name, W / 2, H * 0.36 - 70);
    }
  }
  if (R.over) {
    c.font = 'bold 34px Arial Black, Arial';
    const place = standings().indexOf(P) + 1;
    const txt = R.mode === 'race' ? (P.wrecked ? 'WRECKED!' : 'FINISHED ' + ordinal(P.place) + '!') : R.endReason === 'win' ? (R.teams ? 'YOUR TEAM WINS!' : 'LAST ONE STANDING!') : (R.hunt && R.endReason === 'time') ? 'YOU SURVIVED!' : (R.teams && R.endReason === 'out') ? 'YOUR TEAM LOST' : R.endReason === 'time' ? 'TIME! ' + ordinal(place) : 'WRECKED! ' + ordinal(place);
    c.font = 'bold ' + (txt.length > 14 ? 26 : 34) + 'px Arial Black, Arial';
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillText(txt, W / 2 + 2, H * 0.32 + 2);
    c.fillStyle = R.endReason === 'out' ? '#ff6e6e' : '#ffd54f'; c.fillText(txt, W / 2, H * 0.32);
  }
}

function drawDamageDiagram(c, x, y, v) {
  c.fillStyle = 'rgba(0,0,0,0.5)'; rrect(c, x - 6, y - 2, 118, 92, 10); c.fill();
  const cx = x + 30, cy = y + 44, w = 22, h = 44;
  const col = (f) => {
    const m = v.armorMax[f]; if (!m) return '#555';
    const t = v.armor[f] / m;
    return t > 0.6 ? '#7cd65a' : t > 0.3 ? '#ffc24a' : t > 0 ? '#ff7a3a' : '#c62828';
  };
  c.fillStyle = '#2c2f33'; rrect(c, cx - w / 2, cy - h / 2, w, h, 6); c.fill();
  c.fillStyle = col('F'); rrect(c, cx - w / 2, cy - h / 2 - 6, w, 5, 2); c.fill();
  c.fillStyle = col('B'); rrect(c, cx - w / 2, cy + h / 2 + 1, w, 5, 2); c.fill();
  c.fillStyle = col('L'); rrect(c, cx - w / 2 - 6, cy - h / 2, 5, h, 2); c.fill();
  c.fillStyle = col('R'); rrect(c, cx + w / 2 + 1, cy - h / 2, 5, h, 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.25)'; rrect(c, cx - w / 2 + 3, cy - h / 2 + 8, w - 6, 10, 3); c.fill();
  // frame + tires bars
  const bx = x + 52;
  c.font = 'bold 10px Arial'; c.textAlign = 'left'; c.fillStyle = '#cfd8dc';
  c.fillText('FRAME', bx, y + 18);
  const sf = clamp(v.struct / v.structMax, 0, 1);
  c.fillStyle = '#222'; c.fillRect(bx, y + 22, 54, 7);
  c.fillStyle = sf > 0.5 ? '#7cd65a' : sf > 0.25 ? '#ffc24a' : '#ff5b4a'; c.fillRect(bx, y + 22, 54 * sf, 7);
  c.fillStyle = '#cfd8dc'; c.fillText('TIRES', bx, y + 46);
  const tf = clamp(v.tire / Math.max(1, v.tireMax), 0, 1);
  c.fillStyle = '#222'; c.fillRect(bx, y + 50, 54, 7);
  c.fillStyle = tf > 0.5 ? '#7cd65a' : tf > 0 ? '#ffc24a' : '#ff5b4a'; c.fillRect(bx, y + 50, 54 * tf, 7);
  c.fillStyle = '#cfd8dc'; c.fillText('SPEED', bx, y + 74);
  c.fillStyle = '#fff'; c.font = 'bold 12px Arial'; c.fillText(Math.round((v.speed || 0) * 0.32) + ' mph', bx, y + 86);
}

function endRace() {
  if (R.done) return;
  R.done = true;
  showControls(false);
  SFX.engineStop();
  const P = R.player;
  const st = standings();
  const results = st.map((v, i) => ({ name: v.name, isPlayer: v.isPlayer, human: !!v.human, nid: v.nid || null, place: i + 1, dnf: v.wrecked && !v.finished, kills: v.kills,
    time: v.finished ? v.finishT : null,
    out: v.wrecked ? Math.max(0, (v.outT || R.t) - R.goT) : null, color: v.car.color, body: v.car.body, ally: !!v.ally, team: v.team }));
  const teams = R.teams, teamWon = teams ? st[0].team === P.team : false;
  const reason = R.endReason;
  if (R.net) { const cfg = R.cfg; R = null; netRaceOver(cfg, results, reason, { teams, teamWon, mode: cfg.mode }); return; }
  // save the player's damage back to the car
  const car = R.cfg.playerCar;
  for (const f of FACINGS) car.cur[f] = Math.max(0, Math.round(P.armor[f]));
  car.cur.S = P.retired ? Math.max(1, Math.round(P.struct)) : P.wrecked ? 0 : Math.max(1, Math.round(P.struct));
  car.cur.T = Math.max(0, Math.round(P.tire));
  const cfg = R.cfg;
  R = null;
  UI.raceFinished(cfg, results, reason, { teams, teamWon, mode: cfg.mode || 'ffa', hunt: cfg.mode === 'hunt' });
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- Android bridge --------------------------------------------------------------------
const NB = {
  has() { return !!window.Android; },
  call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    try { if (window.Android && typeof window.Android[fn] === 'function') return window.Android[fn].apply(window.Android, args); } catch (e) { }
    return undefined;
  },
};
let PRICES = {};
let pendingDouble = null;

window.onPrices = function (json) { try { PRICES = JSON.parse(json) || {}; } catch (e) { } if (UI.cur === 'store') UI.store(); };
window.onAdsRemoved = function () { S.adsRemoved = true; PROFILES.adsRemoved = true; saveProfiles(); save(); if (UI.cur === 'store') UI.store(); UI.toast('Banner ads removed. Thank you!'); };
window.onPurchaseComplete = function (id) {
  const p = PRODUCTS[id];
  if (p && p.give) { for (const k in p.give) S.boosts[k] += p.give[k]; save(); SFX.play('crate'); UI.toast(p.name + ' added!'); }
  UI.refresh();
};
window.onPurchaseError = function (m) { UI.toast(m || 'Purchase did not go through.'); };
window.onRewardEarned = function (tag) { grantReward(tag); };
window.onRewardFailed = function () { UI.toast('No video available right now. Try again in a minute.'); };
window.onAndroidPause = function () { if (R && !R.paused && !R.done) pauseRace(true); SFX.suspend(); };
window.onAndroidResume = function () { SFX.resume(); };
window.onAndroidBack = function () { return UI.back(); };

function adsLeftToday() { if (S.ads.d !== today()) { S.ads = { d: today(), n: 0 }; } return AD_REWARDS_PER_DAY - S.ads.n; }

function watchAd(tag) {
  if (tag === 'boosts' && adsLeftToday() <= 0) { UI.toast('That\'s all the free videos for today. Come back tomorrow!'); return; }
  if (NB.has()) { NB.call('showRewarded', tag); return; }
  // Browser preview: pretend the video played
  UI.toast('(Preview) Video ad would play here…');
  setTimeout(() => grantReward(tag), 900);
}

function grantReward(tag) {
  if (tag === 'boosts') {
    adsLeftToday(); S.ads.n++;
    S.boosts.nitro++; S.boosts.repair++; save();
    SFX.play('crate'); UI.toast('+1 Nitro, +1 Repair Kit');
  } else if (tag === 'double' && pendingDouble) {
    S.money += pendingDouble.amount; S.stats.earned += pendingDouble.amount; save();
    pendingDouble.done = true;
    SFX.play('buy'); UI.toast('Prize doubled: +' + fmt$(pendingDouble.amount));
  }
  UI.refresh();
}

function buyProduct(id) {
  if (id === 'remove_ads' && S.adsRemoved) return;
  if (NB.has()) NB.call('buy', id);
  else UI.toast('Purchases work in the Android app from Google Play.');
}

// ---- helpers -----------------------------------------------------------------------------
const FIELD_CAT = { engine: 'engine', tires: 'tires', front: 'weapon', turret: 'weapon', rear: 'dropper', acc: 'acc' };
function slotGet(car, field, i) { return Array.isArray(car[field]) ? car[field][i] || null : car[field]; }
function slotSet(car, field, i, val) {
  if (Array.isArray(car[field])) { car[field][i] = val; while (car[field].length && !car[field][car[field].length - 1]) car[field].pop(); }
  else car[field] = val;
}
function partWeight(cat, key) { if (!key) return 0; const d = partDef(cat, key); return d.weight + (cat === 'weapon' && UI._field === 'turret' ? 120 : 0); }
function partStatLine(cat, d) {
  if (cat === 'engine') return d.hp + ' hp';
  if (cat === 'tires') return 'Grip ' + Math.round(d.grip * 100) + '% · ' + d.hp + ' HP' + (d.spikeResist ? ' · spike-resistant' : '');
  if (cat === 'weapon') return (d.ammo ? d.ammo + ' shots' : 'Unlimited') + ' · ' + Math.round(d.dmg * d.rate) + ' dmg/s' + (d.splash ? ' · blast' : '') + (d.cat === 'missile' ? ' · homing' : '') + (d.cat === 'guided' ? ' · you steer it: tap ROCKET, then tap the target' : '');
  if (cat === 'dropper') return d.uses + ' uses' + (d.dmg ? ' · ' + d.dmg + ' dmg' : '');
  if (cat === 'acc') return d.desc;
  return '';
}
function tierLockText(t) { return 'Unlocks in the ' + SERIES.find(s => s.tier === t).name; }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function seriesParams(si) {
  const s = SERIES[si];
  const lvl = si === 3 ? S.legends : 0;
  return { mult: s.mult * (1 + 0.15 * lvl), skill: Math.min(0.97, s.skill + 0.02 * lvl), budget: [s.budget[0] * (1 + 0.15 * lvl), s.budget[1] * (1 + 0.15 * lvl)] };
}

// Before each event the player picks the competition, the opponents (how many Easy, Medium and
// Hard drivers) and the map. Each event also has a featured circuit and city arena.
const MODES = {
  race: { name: 'Lap race', desc: 'Race the circuit for as many laps as you choose. First across the line wins. Weapons are on, so wreck anyone in your way.' },
  ffa:  { name: 'Every car for itself', desc: 'Everyone fights everyone. Last one standing wins.' },
  team: { name: 'Team battle', desc: 'You and your teammates (★) against the rivals. You get enough teammates to make the sides even. No friendly fire.' },
  hunt: { name: 'All vs You', desc: 'Every other car is out to get you. Wreck them all, or survive until time runs out. Pays 40% more.' },
};
const DIFF_DESC = { easy: 'Slower, shakier aim, softer hits', medium: 'Fights at this circuit\'s usual level', hard: 'Faster, sharper aim, hits harder' };
function featuredCodes(si) {
  const s = SERIES[si], st = S.series[si], k = st.race % s.tracks.length;
  return { track: s.tracks[k], city: s.cities[k] };
}
// the map for this event: the player's pick if it suits the competition, otherwise the featured circuit
function eventCode(si) {
  const f = featuredCodes(si);
  const pick = S.mapPick;
  if (pick != null && mapExists(pick) && !(S.mode === 'race' && isCityCode(pick))) return String(pick);
  if (S.mode !== 'race' && S.venue === 'city') return f.city;
  return f.track;
}
// how many Easy / Medium / Hard rivals, kept within the limit for the competition
function oppCounts() {
  const o = Object.assign({ easy: 0, medium: 5, hard: 0 }, S.opp || {});
  const cap = S.mode === 'team' ? MAX_TEAM_OPP : MAX_OPP;
  for (const k of ['medium', 'easy', 'hard']) while (o.easy + o.medium + o.hard > cap && o[k] > 0) o[k]--;
  if (o.easy + o.medium + o.hard < 1) o.medium = 1;
  o.total = o.easy + o.medium + o.hard;
  o.mates = S.mode === 'team' ? o.total - 1 : 0;
  return o;
}
// extra drivers so bigger fields have someone to fill them (they don't score championship points)
function makeGuests(si, rivals) {
  const s = SERIES[si], p = seriesParams(si);
  const taken = rivals.map(r => r.name);
  const names = shuffle(AI_NAMES.filter(n => taken.indexOf(n) < 0)).slice(0, 4);
  return names.map((n, k) => ({ name: n, guest: true, style: pick(['aggressive', 'balanced', 'defensive']), car: aiBuildCar(rnd(p.budget[0], p.budget[1]) * (0.92 + k * 0.04), s.tier, si >= 2 ? 0.3 : 0) }));
}
// who's in this event: teammates first (Medium), then the rivals, hardest first
function eventField(si) {
  const st = S.series[si];
  if (!st.guests) { st.guests = makeGuests(si, st.rivals); save(); }
  const o = oppCounts(), pool = st.rivals.concat(st.guests);
  const diffs = [].concat(Array(o.hard).fill('hard'), Array(o.medium).fill('medium'), Array(o.easy).fill('easy'));
  const out = [];
  for (let i = 0; i < o.mates; i++) out.push({ r: pool[i], diff: 'medium', ally: true });
  diffs.forEach((d, i) => out.push({ r: pool[o.mates + i], diff: d, ally: false }));
  return out.filter(x => x.r);
}
// prize multiplier: bigger, harder fields (and All vs You) pay more
function eventMult(si) {
  const o = oppCounts(), p = seriesParams(si);
  const diffF = (o.easy * DIFFS.easy.prize + o.medium * DIFFS.medium.prize + o.hard * DIFFS.hard.prize) / o.total;
  const fieldF = 0.55 + 0.09 * o.total;
  return p.mult * diffF * fieldF * (S.mode === 'hunt' ? HUNT_BONUS : 1);
}
// small picture of a map for the picker
const thumbCache = {};
function mapThumb(code) {
  if (thumbCache[code]) return thumbCache[code];
  const cv = document.createElement('canvas'); cv.width = cv.height = 96;
  const c = cv.getContext('2d');
  try {
    if (isCustomCode(code)) {
      const m = customMap(code);
      if (m.kind === 'arena') drawArenaThumb(c, m, 96); else drawCircuitThumb(c, m.pts, THEMES[m.theme] || THEMES.desert, 96);
    } else if (isCityCode(code)) {
      const idx = parseInt(String(code).slice(1), 10), T = buildCity(idx);
      c.drawImage(T.mm.cv, 0, 0, 96, 96);
    } else {
      const t = TRACKS[parseInt(code, 10)];
      drawCircuitThumb(c, t.pts, THEMES[t.theme], 96);
    }
  } catch (e) { }
  thumbCache[code] = cv;
  return cv;
}
function splinePoints(cp, per) {
  const out = [], n = cp.length;
  for (let i = 0; i < n; i++) { const p0 = cp[(i - 1 + n) % n], p1 = cp[i], p2 = cp[(i + 1) % n], p3 = cp[(i + 2) % n]; for (let k = 0; k < per; k++) out.push(catmull(p0, p1, p2, p3, k / per)); }
  return out;
}
function drawCircuitThumb(c, cp, th, S) {
  c.fillStyle = th.ground; c.fillRect(0, 0, S, S);
  if (!cp || cp.length < 3) return;
  const pts = splinePoints(cp, 12);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (const p of pts) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); }
  const sc = (S - 18) / Math.max(maxx - minx, maxy - miny, 1), ox = (S - (maxx - minx) * sc) / 2 - minx * sc, oy = (S - (maxy - miny) * sc) / 2 - miny * sc;
  c.lineJoin = 'round';
  c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] * sc + ox, p[1] * sc + oy) : c.moveTo(p[0] * sc + ox, p[1] * sc + oy)); c.closePath();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = Math.max(5, 260 * sc); c.stroke();
  c.strokeStyle = th.asphalt; c.lineWidth = Math.max(3, 200 * sc); c.stroke();
  c.fillStyle = '#ffd34d'; c.fillRect(pts[0][0] * sc + ox - 3, pts[0][1] * sc + oy - 3, 6, 6);
}
function drawArenaThumb(c, m, S) {
  const th = CITY_THEMES[m.theme] || CITY_THEMES.city, n = m.n, cs = S / n;
  c.fillStyle = th.ground; c.fillRect(0, 0, S, S);
  for (let k = 0; k < n * n; k++) {
    const v = m.cells.charAt(k); if (v === '0') continue;
    const x = (k % n) * cs, y = ((k / n) | 0) * cs;
    c.fillStyle = v === '1' ? th.roofs[0] : v === '2' ? '#b4b6b8' : '#3b7340';
    if (v === '1') c.fillRect(x, y, cs + 0.5, cs + 0.5); else if (v === '2') c.fillRect(x + cs * 0.15, y + cs * 0.35, cs * 0.7, cs * 0.3); else { c.beginPath(); c.arc(x + cs / 2, y + cs / 2, cs * 0.35, 0, 6.3); c.fill(); }
  }
}

// Older saves have no style stored: give each driver a fixed one from their name
function rivalStyle(r) {
  if (r.style) return r.style;
  let h = 0; for (const ch of r.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ['aggressive', 'balanced', 'defensive'][h % 3];
}

function makeRivals(si) {
  const s = SERIES[si], p = seriesParams(si);
  const names = shuffle(AI_NAMES).slice(0, 5);
  // a mix of driving styles every time: at least one aggressive and one defensive driver
  const styles = shuffle(['aggressive', 'defensive', pick(['aggressive', 'balanced', 'defensive']), 'balanced', pick(['aggressive', 'defensive'])]);
  return names.map((n, k) => ({ name: n, style: styles[k], car: aiBuildCar(rnd(p.budget[0], p.budget[1]) * (0.9 + k * 0.05), s.tier, si >= 2 ? 0.3 : 0) }));

  begin(si) {
    const st = S.series[si], p = seriesParams(si);
    if (!st.rivals) { st.rivals = makeRivals(si); st.guests = null; save(); }
    const code = eventCode(si);
    const o = oppCounts();
    const rivals = eventField(si).map(x => { const c = clone(x.r.car); repairCar(c); return { name: x.r.name, car: c, style: rivalStyle(x.r), diff: x.diff, guest: !!x.r.guest }; });
    $('#screen').style.display = 'none';
    this.cur = 'race';
    SFX.init();
    startRace({ si, track: code, playerCar: curCar(), rivals, skill: p.skill, mult: eventMult(si), mode: S.mode || 'ffa', laps: S.laps || LAPS, mates: o.mates, limit: battleLimit(code, S.tlim, S.mode) });
    this.updateBoostButtons();

      '<button class="btn sec" data-act="retire">Retire from race</button></div>';

  updateBoostButtons() {
    for (const k of ['nitro', 'repair', 'ammo']) {
      const el = document.querySelector('#b_' + k + ' b');

  // ---------------------------------------------------------------- after a race
  raceFinished(cfg, results, reason, tm) {
    tm = tm || {};
    const si = cfg.si, s = SERIES[si], st = S.series[si];
    const me = results.find(r => r.isPlayer);
    // team battles: your team's result decides your place (1st if your team wins, 2nd if not)
    if (tm.teams) me.place = tm.teamWon ? 1 : 2;
    // every place pays; you earn your place even if you were wrecked
    const basePrize = Math.round((tm.teams ? PRIZES[tm.teamWon ? 0 : 2] : PRIZES[Math.min(me.place, PRIZES.length) - 1]) * cfg.mult);
    // ...and never less than what it costs to get your car back to 90%
    const repair90 = repairCostTo(curCar(), 0.9);
    const placePrize = Math.max(basePrize, repair90);
    const allowance = placePrize > basePrize;
    const killPrize = Math.round(me.kills * KILL_BONUS * cfg.mult);
    const total = placePrize + killPrize;
    S.money += total;
    S.stats.races++; S.stats.kills += me.kills; S.stats.earned += total;
    if (me.place === 1) S.stats.wins++;
    st.pts = st.pts || {};
    for (const r of results) {
      // guest drivers don't score championship points
      if (!r.isPlayer && !st.rivals.some(x => x.name === r.name)) continue;
      const won = tm.teams ? (r.ally || r.isPlayer) === tm.teamWon : false;
      st.pts[r.name] = (st.pts[r.name] || 0) + (tm.teams ? (won ? 8 : 3) : (POINTS[r.place - 1] || 0));
    }
    st.race++;
    let crate = null, boost = null;
    if (me.place === 1 || (!tm.teams && me.place <= 3 && Math.random() < 0.35)) { crate = rollCrate(s.tier); invAdd(crate.cat, crate.key); }
    if (me.place <= 3) { boost = pick(['nitro', 'repair', 'ammo']); S.boosts[boost]++; }
    pendingDouble = total > 0 ? { amount: total, done: false } : null;
    save();
    this.go('results', { si, results, me, placePrize, killPrize, total, crate, boost, mult: cfg.mult, reason, teams: tm.teams, teamWon: tm.teamWon, allowance, mode: tm.mode, hunt: tm.hunt });
  },

      h += '<div class="card crate"><div class="cbox">🎁</div><div><b>Reward crate!</b><br>You got: <b>' + esc(pd.name) + '</b><br><span class="dim small">' + TIER_NAMES[pd.tier] + ' part, worth ' + fmt$(pd.price) + '. It\'s in your spare parts.</span></div></div>';

    if (d.boost) h += '<p class="center">Podium bonus: <b style="color:' + BOOSTS[d.boost].color + '">+1 ' + BOOSTS[d.boost].name + '</b></p>';
    const done = st.race >= 4;
    h += '<div class="spacer"></div></div><div class="foot"><button class="btn sec" data-act="nav" data-to="garage">Garage</button>' +

  seriesEnd(si) {

      const bonus = rank <= 3 ? Math.round(SERIES_BONUS[rank - 1] * p.mult) : 0;

      if (rank === 1) { S.boosts.nitro += 2; S.boosts.repair += 2; S.boosts.ammo += 2; }

// Vehicles can be returned for the full price paid (body + armor), less any repairs it needs.
function returnValue(car) {
  const armor = (car.armor.F + car.armor.B + car.armor.L + car.armor.R) * ARMORS[car.armorType].cpp;
  return Math.max(0, Math.round(BODIES[car.body].price + armor - repairCost(car)));
}
function returnCar(idx) {
  const car = S.cars[idx];
  S.money += returnValue(car);
  if (car.engine) invAdd('engine', car.engine);
  if (car.tires) invAdd('tires', car.tires);
  for (const k of car.front.concat(car.turret)) if (k) invAdd('weapon', k);
  for (const k of car.rear) if (k) invAdd('dropper', k);
  for (const k of car.acc) if (k) invAdd('acc', k);
  S.cars.splice(idx, 1);
}

function fmtClock(t) { return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); }
function fmtTime(t) { return Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0'); }

function standingsTable(pts, n) {
  const rows = Object.keys(pts).map(k => ({ k, p: pts[k] })).sort((a, b) => b.p - a.p).slice(0, n);
  let h = '<div class="card list stand">';
  rows.forEach((r, i) => { h += '<div class="prow nohover' + (r.k === 'You' ? ' me' : '') + '"><span class="pos">' + (i + 1) + '</span><span class="pv">' + esc(r.k) + '</span><b>' + r.p + ' pts</b></div>'; });
  return h + '</div>';
}

// ---- actions ---------------------------------------------------------------------------------
const ACT = {
  nav(d) { UI.go(d.to); },
  close() { UI.closeModal(); },
  yes() { const f = UI._yes; UI.closeModal(); if (f) f(); },
  starter(d) {
    const i = +d.i;
    if (i >= 0) {
      const t = STARTERS[i];
      const car = buildFromTemplate(t); car.num = irnd(2, 99);
      S.money = START_MONEY - templateCost(t);
      S.cars = [car];
    } else {
      S.money = START_MONEY;
      S.cars = [];
      UI.modal('<h3>Pick a body</h3><p class="dim small">Your money: ' + fmt$(S.money) + '</p><div class="plist">' +
        Object.keys(BODIES).filter(k => BODIES[k].tier === 1).map(k => '<button class="pitem" data-act="firstbody" data-k="' + k + '"><span class="pn">' + BODIES[k].name + '<small>' + esc(BODIES[k].desc) + '</small></span><span class="pr"><b>' + fmt$(BODIES[k].price) + '</b></span></button>').join('') +
        '</div>');
      return;
    }
    S.sel = 0; S.firstRun = false; save();
    UI.go('garage');
    UI.toast('Welcome to the garage! Tap any part to change it.');
  },
  firstbody(d) {
    const b = BODIES[d.k];
    const car = newCar(d.k); S.money -= b.price; S.cars = [car]; S.sel = 0; S.firstRun = false; save();
    UI.go('garage');
    UI.toast('Now add an engine and tires.');
  },
  selcar(d) { S.sel = +d.i; save(); UI.go('garage'); },
  newcar() { UI.newCar(); },
  buybody(d) {
    const b = BODIES[d.k]; if (S.money < b.price || S.cars.length >= MAX_CARS) return;
    S.money -= b.price; S.cars.push(newCar(d.k)); S.sel = S.cars.length - 1; save();
    SFX.play('buy'); UI.go('garage'); UI.toast('New ' + b.name + '! Add an engine and tires.');
  },
  sellcar() {
    const car = curCar();
    if (S.cars.length <= 1) { UI.newCar(true); return; }
    const val = returnValue(car);
    UI.confirm('Return this ' + esc(BODIES[car.body].name) + ' for ' + fmt$(val) + '? That\'s the full price of the body and its armor' + (repairCost(car) ? ', minus ' + fmt$(repairCost(car)) + ' of damage' : '') + '. Its engine, tires, weapons and accessories go to your spare parts.', 'Return', () => {
      returnCar(S.sel);
      S.sel = 0; save(); UI.go('garage'); UI.toast('Returned for ' + fmt$(val));
    });
  },
  swapbody(d) {
    const old = curCar(), idx = S.sel;
    const val = returnValue(old), b = BODIES[d.k];
    if (S.money + val < b.price) return;
    const parts = { engine: old.engine, tires: old.tires, front: old.front.filter(Boolean), turret: old.turret.filter(Boolean), rear: old.rear.filter(Boolean), acc: old.acc.filter(Boolean) };
    returnCar(idx);
    S.money -= b.price;
    const car = newCar(d.k, old.color); car.num = old.num;
    S.cars.splice(idx, 0, car); S.sel = idx;
    // move the old parts across where they fit
    const fit = (cat, field, k, i) => {
      if (!k || !invHas(cat, k)) return;
      const w = partDef(cat, k).weight + (field === 'turret' ? 120 : 0);
      if (carLoad(car) + w > b.maxLoad) return;
      invTake(cat, k); slotSet(car, field, i, k);
    };
    fit('engine', 'engine', parts.engine, 0);
    fit('tires', 'tires', parts.tires, 0);
    if (car.tires) car.cur.T = TIRES[car.tires].hp;
    parts.front.slice(0, b.mounts.front).forEach((k, i) => fit('weapon', 'front', k, i));
    parts.turret.slice(0, b.mounts.turret).forEach((k, i) => fit('weapon', 'turret', k, i));
    parts.rear.slice(0, b.mounts.rear).forEach((k, i) => fit('dropper', 'rear', k, i));
    parts.acc.slice(0, b.acc).forEach((k, i) => fit('acc', 'acc', k, i));
    save(); SFX.play('buy'); UI.closeModal(); UI.go('garage');
    UI.toast('Swapped to a ' + b.name + '. Add armor in the garage.');
  },
  pick(d) { UI.pick(d.field, +d.i); },
  equip(d) {
    const car = curCar(), field = d.field, i = +d.i, cat = FIELD_CAT[field], k = d.k;
    const def = partDef(cat, k);
    if (invHas(cat, k)) invTake(cat, k);
    else { if (S.money < def.price) return SFX.play('error'); S.money -= def.price; SFX.play('buy'); }
    const old = slotGet(car, field, i);
    if (old) invAdd(cat, old);
    slotSet(car, field, i, k);
    if (field === 'tires') car.cur.T = TIRES[k].hp;
    save(); UI.closeModal(); UI.go('garage');
  },
  unequip(d) {
    const car = curCar(), cat = FIELD_CAT[d.field];
    const old = slotGet(car, d.field, +d.i);
    if (old) { invAdd(cat, old); slotSet(car, d.field, +d.i, null); }
    if (d.field === 'tires') car.cur.T = 0;
    save(); UI.closeModal(); UI.go('garage');
  },
  sell(d) {
    const [cat, key] = d.id.split(':'); const def = partDef(cat, key);
    if (!invTake(cat, key)) return;
    S.money += Math.round(def.price / 2); save(); SFX.play('buy'); UI.go('garage');
  },
  armor(d) {
    const car = curCar(), b = BODIES[car.body], a = ARMORS[car.armorType], f = d.f, n = +d.d;
    if (n > 0) {
      if (car.armor[f] + n > b.armorMax) return UI.toast('That side is fully armored.');
      if (S.money < a.cpp * n) return UI.toast('Not enough money.');
      if (carLoad(car) + a.wpp * n > b.maxLoad) return UI.toast('Too heavy: this body can\'t carry more.');
      S.money -= a.cpp * n; car.armor[f] += n; car.cur[f] += n;
    } else {
      if (car.armor[f] <= 0) return;
      const m = Math.min(-n, car.armor[f]);
      car.armor[f] -= m; car.cur[f] = Math.min(car.cur[f], car.armor[f]);
      S.money += Math.round(a.cpp * m * 0.5);
    }
    SFX.play('click'); save(); UI.go('garage');
  },
  armortype() { UI.armorType(); },
  setarmor(d) {
    const car = curCar(), n = car.armor.F + car.armor.B + car.armor.L + car.armor.R;
    const pay = Math.round(n * ARMORS[d.k].cpp - n * ARMORS[car.armorType].cpp * 0.5);
    if (pay > S.money) return;
    S.money -= pay; car.armorType = d.k; for (const f of FACINGS) car.cur[f] = car.armor[f];
    save(); SFX.play('buy'); UI.closeModal(); UI.go('garage');
  },
  paint(d) { curCar().color = d.c; save(); UI.go('garage'); },
  renum() { curCar().num = irnd(2, 99); save(); UI.go('garage'); },
  repair() {
    const car = curCar(), c = repairCost(car); if (S.money < c) return;
    S.money -= c; repairCar(car); save(); SFX.play('repair');
    UI.refresh();
  },
  patch() { const car = curCar(); car.cur.S = Math.ceil(BODIES[car.body].struct * 0.5); if (car.tires) car.cur.T = Math.max(car.cur.T, Math.ceil(TIRES[car.tires].hp * 0.5)); save(); UI.go('garage'); UI.toast('Patched up! Frame at 50%.'); },
  prerace(d) { UI.go('prerace', +d.i); },
  go(d) { UI.begin(+d.i); },
  seriesend(d) { UI.go('seriesEnd', +d.i); },
  endseries(d) {
    const st = S.series[+d.i];
    st.race = 0; st.pts = null; st.rivals = null; st.guests = null; delete st._final; save();
    UI.go('series');
  },
  ad(d) { watchAd(d.tag); },
  daily() { if (S.lastDaily === today()) return; S.lastDaily = today(); S.boosts.nitro++; S.boosts.repair++; S.boosts.ammo++; save(); SFX.play('crate'); UI.toast('Daily gift: +1 of each boost'); UI.refresh(); },

// Fixed joystick in the bottom corner.
// Left/right = steer, up = gas (how far up = how much), down = brake / reverse.
function setupJoystick() {
  const zone = document.getElementById('joyzone'), base = document.getElementById('joybase'), knob = document.getElementById('joyknob');
  const RAD = 58;
  let pid = null, cx = 0, cy = 0;
  const setKnob = (dx, dy) => { knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; };
  window.resetJoystick = () => {
    pid = null; INPUT.jx = 0; INPUT.jy = 0; setKnob(0, 0);
    base.classList.remove('active');
  };
  const move = (e) => {
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > RAD) { dx *= RAD / d; dy *= RAD / d; }
    setKnob(dx, dy);
    const nx = dx / RAD, ny = -dy / RAD;
    INPUT.jx = Math.abs(nx) < 0.12 ? 0 : nx;
    INPUT.jy = Math.abs(ny) < 0.12 ? 0 : ny;
  };
  zone.addEventListener('pointerdown', (e) => {
    if (pid !== null) return;
    e.preventDefault();
    pid = e.pointerId;
    try { zone.setPointerCapture(pid); } catch (x) { }
    const r = base.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    base.classList.add('active');
    move(e);
  });
  zone.addEventListener('pointermove', (e) => { if (e.pointerId === pid) move(e); });
  const end = (e) => { if (e.pointerId === pid) window.resetJoystick(); };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  zone.addEventListener('lostpointercapture', end);
  zone.addEventListener('contextmenu', (e) => e.preventDefault());
}

// Touch-to-drive on the game screen itself (anywhere that isn't a button or the joystick)
function setupTouchDrive() {
  const cv = document.getElementById('app');
  let pid = null;
  // screen point -> point on the game drawing (they differ in the tilted 3D view)
  const toCanvas = (e) => { const r = cv.getBoundingClientRect(); return screenToCanvas(e.clientX - r.left, e.clientY - r.top); };
  const at = (e) => { const [x, y] = toCanvas(e); INPUT.tx = x; INPUT.ty = y; };
  const onRoad = (e) => e.target && (e.target.id === 'game' || e.target.id === 'app' || e.target.id === 'hud');
  cv.addEventListener('pointerdown', (e) => {
    if (!R || R.done || !onRoad(e)) return;
    // guided rocket armed: this tap picks where it goes (and doesn't steer the car)
    if (R.aim) { e.preventDefault(); const [x, y] = toCanvas(e); aimAt(x, y); syncRocketBtn(); return; }
    if (pid !== null) return;
    e.preventDefault(); pid = e.pointerId;
    try { cv.setPointerCapture(pid); } catch (x) { }
    at(e); INPUT.touch = true;
  });
  cv.addEventListener('pointermove', (e) => { if (e.pointerId === pid) at(e); });
  const end = (e) => { if (e.pointerId === pid) { pid = null; INPUT.touch = false; } };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('lostpointercapture', end);
  window.resetTouchDrive = () => { pid = null; INPUT.touch = false; };
}

//  Map editor: the player designs circuits (drag points to shape the road)
//  and city arenas (paint buildings, barriers and trees on a grid).
//  Designs are saved on the phone and shared by every profile.
// ======================================================================

const MAX_MAPS = 30;
const CIRCUIT_W = { S: 2000, M: 3000, L: 4200 };
const CIRCUIT_THEMES = ['desert', 'canyon', 'industrial', 'snow', 'forest', 'coast'];
const ARENA_THEMES = ['city', 'oldtown', 'harbor'];
const EDIT = { m: null, isNew: true, tool: 'move', drag: -1, issues: [], warn: [], ret: null, painting: null, dirty: false };

function newCircuitDraft() {
  const W = CIRCUIT_W.M;
  const pts = [[0.2, 0.2], [0.55, 0.15], [0.82, 0.28], [0.82, 0.72], [0.5, 0.85], [0.18, 0.7]].map(p => [Math.round(p[0] * W), Math.round(p[1] * W)]);
  return { kind: 'circuit', name: 'My Circuit', size: 'M', theme: 'desert', pts };
}
function arenaPattern(n, kind) {
  let s = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let v = '0';
    if (kind === 'grid' && x > 0 && y > 0 && x < n - 1 && y < n - 1 && (x % 4 === 1 || x % 4 === 2) && (y % 4 === 1 || y % 4 === 2)) v = '1';
    s += v;
  }
  return s;
}
function newArenaDraft() {
  const n = ARENA_N.M;
  return { kind: 'arena', name: 'My Arena', size: 'M', theme: 'city', n, cells: arenaPattern(n, 'grid') };
}

// ---- checks --------------------------------------------------------------------------
function checkCircuit(m) {
  const issues = [], spots = [];
  if (m.pts.length < 4) return { issues: ['Add at least 4 points (tap the map).'], spots, warn: [] };
  const pts = splinePoints(m.pts, 24);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = cum[cum.length - 1] + Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
  // the road must not cross or run too close to itself (it needs room for the walls)
  const seen = {};
  for (let i = 0; i < pts.length; i += 2) for (let j = i + 2; j < pts.length; j += 2) {
    const along = Math.min(cum[j] - cum[i], len - (cum[j] - cum[i]));
    if (along < 900) continue;
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d < 2 * ROAD_HALF + 110) {
      const key = Math.round(pts[i][0] / 300) + ',' + Math.round(pts[i][1] / 300);
      if (!seen[key]) { seen[key] = 1; spots.push(pts[i], pts[j]); }
    }
  }
  if (spots.length) issues.push('The road crosses or runs too close to itself at the red marks. Drag the points apart.');
  if (len < 3000) issues.push('The lap is too short. Spread the points out.');
  // very tight turns (a warning only)
  const warn = [];
  let tight = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[(i - 3 + pts.length) % pts.length], b = pts[i], c = pts[(i + 3) % pts.length];
    const a1 = Math.atan2(b[1] - a[1], b[0] - a[0]), a2 = Math.atan2(c[1] - b[1], c[0] - b[0]);
    const turn = Math.abs(normA(a2 - a1)), seg = Math.hypot(c[0] - a[0], c[1] - a[1]) || 1;
    if (turn / seg > 1 / 150) tight++;
  }
  if (tight) warn.push('Some corners are very tight hairpins. They work, but bigger cars will scrape the walls.');
  return { issues, spots, warn, len };
}
function checkArena(m) {
  const an = arenaAnalyze(m.n, m.cells);
  const issues = [], warn = [];
  if (an.mainCount < 40) issues.push('There isn\'t enough open street to drive on. Erase some buildings.');
  else if (an.spawns.length < 8) issues.push('The streets need more room: make the open area bigger.');
  if (an.cutOff > 0) warn.push(an.cutOff + ' open square' + (an.cutOff > 1 ? 's are' : ' is') + ' walled off (shown in red). Cars can\'t get there.');
  return { issues, warn, an };
}

// ---- the drawing canvas ------------------------------------------------------------------
function edWorld() { const m = EDIT.m; return m.kind === 'arena' ? m.n * ARENA_CELL : CIRCUIT_W[m.size]; }
function setupEditorCanvas() {
  const cv = $('#edcv'); if (!cv) return;
  const wrap = cv.parentNode, w = wrap.clientWidth, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr); cv.style.width = w + 'px'; cv.style.height = w + 'px';
  EDIT.cv = cv; EDIT.px = w; EDIT.dpr = dpr;
  const toWorld = (e) => { const r = cv.getBoundingClientRect(), W = edWorld(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * W]; };
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x, y] = toWorld(e); edDown(x, y);
  });
  cv.addEventListener('pointermove', (e) => { if (EDIT.drag < 0 && EDIT.painting == null) return; const [x, y] = toWorld(e); edMove(x, y); });
  const up = () => { edUp(); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  edCheck(); drawEditor();
}
function edPick(x, y) {
  const m = EDIT.m, W = edWorld(), rad = 26 / EDIT.px * W;
  let best = -1, bd = rad;
  m.pts.forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = i; } });
  return best;
}
function edDown(x, y) {
  const m = EDIT.m, W = edWorld();
  if (m.kind === 'arena') {
    const n = m.n, cx = Math.floor(x / ARENA_CELL), cy = Math.floor(y / ARENA_CELL);
    if (cx < 0 || cy < 0 || cx >= n || cy >= n) return;
    // painting over the same thing erases, so a tap toggles
    const cur = m.cells.charAt(cy * n + cx);
    EDIT.painting = (cur === EDIT.tool && EDIT.tool !== '0') ? '0' : EDIT.tool;
    edPaint(cx, cy);
    return;
  }
  const i = edPick(x, y);
  if (EDIT.tool === 'del') {
    if (i >= 0) { if (m.pts.length <= 4) { UI.toast('A circuit needs at least 4 points'); return; } m.pts.splice(i, 1); EDIT.dirty = true; edCheck(); drawEditor(); }
    return;
  }
  if (i >= 0) { EDIT.drag = i; return; }
  if (m.pts.length >= 24) { UI.toast('That\'s the most points a circuit can have (24)'); return; }
  // add a point on the nearest stretch of road
  const P = [clamp(x, 150, W - 150), clamp(y, 150, W - 150)];
  let bi = 0, bd = 1e9;
  for (let k = 0; k < m.pts.length; k++) {
    const a = m.pts[k], b = m.pts[(k + 1) % m.pts.length];
    const d = distToSeg(P[0], P[1], a[0], a[1], b[0], b[1]);

}

'use strict';
// ======================================================================
//  Multiplayer with nearby phones (Google Nearby Connections, no internet)
//
//  One phone HOSTS: it runs the whole game (physics, AI, damage) and sends
//  everyone a snapshot ~15 times a second. Phones that JOIN send their
//  steering, gas, fire and drop ~20 times a second, plus one-off actions
//  (boosts, guided rocket targets), and draw what the host sends them.
//  Matches are friendly: cars start fully repaired, damage isn't kept,
//  and everyone earns a small prize for their place.

  connecting: null,
  lobby: null,           // guest: last lobby info from the host

    case 'found': if (NET.role === 'guest') { NET.found[ev.id] = ev.name || 'Host'; netRefresh('mpjoin'); } break;
    case 'lost': if (NET.role === 'guest') { delete NET.found[ev.id]; netRefresh('mpjoin'); } break;
    case 'connected':
      if (NET.role === 'guest') {
        NET.hostId = ev.id; NET.connecting = null;
        netSend({ t: 'hello', ver: NET_VER, name: activeProfile().name, car: mpCar() });
        netRefresh('mpjoin');
      }
      break;
    case 'failed':
      if (NET.role === 'guest') { NET.connecting = null; UI.toast('Couldn\'t connect. Try again.'); netRefresh('mpjoin'); }
      break;
    case 'disconnected': netDisconnected(ev.id); break;
    case 'msg': { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (NET.role === 'host') hostMessage(ev.id, m); else if (NET.role === 'guest') guestMessage(m); break; }

// your car for a friendly match: a fully repaired copy
function mpCar() { const c = clone(curCar()); repairCar(c); return c; }

// Radios and permissions must be on before advertising or searching.
function netReady(then) {
  const L = linkApi();
  if (!L) { UI.modal('<h3>Play nearby</h3><p class="mt">Nearby play works in the Road Battle app on Android phones. It isn\'t available here.</p><button class="btn wide" data-act="close">OK</button>'); return; }
  let st = {}; try { st = JSON.parse(linkCall('nearbyStatus') || '{}'); } catch (e) { }
  if (st.perm === false) { NET.pendingStart = then; linkCall('nearbyRequestPermissions'); return; }
  if (st.bt === false && st.wifi === false) {
    UI.modal('<h3>Turn on Bluetooth and Wi-Fi</h3><p class="mt">Nearby play connects phones over Bluetooth and Wi-Fi (no internet needed). Turn both on, on every phone, then try again.</p>' +
      '<div class="row2"><button class="btn sec" data-act="radio" data-r="bt">Bluetooth</button><button class="btn sec" data-act="radio" data-r="wifi">Wi-Fi</button></div><button class="btn wide" data-act="close">Done</button>');
    return;
  }

}
function netStop() {
  linkCall('nearbyStop');

// ---- settings for a hosted game -------------------------------------------------------
function mpSettings() {

  if (!mapExists(m.map) || (m.mode === 'race' && isCityCode(m.map))) m.map = m.mode === 'race' ? '0' : 'c0';

  race: { name: 'Lap race', desc: 'Everyone races the laps. First across the line wins.' },
  ffa: { name: 'Every car for itself', desc: 'People and computer cars all fight. Last one standing wins.' },
  team: { name: 'People vs computer', desc: 'All the players on one team against the computer cars.' },

    mode: m.mode, map: mapName(m.map), size: SIZE_NAMES[mapSize(m.map)] || '', ai: mpOppTotal(m), laps: m.laps, time: fmtLimit(battleLimit(String(m.map), m.tlim, m.mode)) };

function hostMessage(id, m) {

    if (Object.keys(NET.peers).length >= MAX_GUESTS || (R && !R.done)) { netSend({ t: 'nope', why: (R && !R.done) ? 'That game has already started.' : 'That game is full.' }, id); linkCall('nearbyDisconnect', id); return; }

    mpClampOpp(mpSettings());
    UI.toast(NET.peers[id].name + ' joined');
    sendLobby(); netRefresh('mphost');

    const v = R && R.cars && R.cars.find(c => c.nid === id);
    if (v) v.input = m;
  } else if (m.t === 'a') {
    const v = R && R.cars && R.cars.find(c => c.nid === id);
    if (!v || v.wrecked || R.over) return;
    if (m.a === 'nitro') { if (v.nitroT <= 0) useNitro(v); }
    else if (m.a === 'repair') applyRepairKit(v);
    else if (m.a === 'ammo') { for (const w of v.weapons) w.ammo = w.def.ammo || Infinity; for (const d of v.droppers) d.uses = d.def.uses; }
    else if (m.a === 'aim') {
      const w = v.weapons.filter(w => w.def.cat === 'guided' && w.ammo > 0).sort((a, b) => a.cd - b.cd)[0];
      if (w) { if (w.cd > 0) v.aimQ = { w, tx: m.x, ty: m.y }; else fireGuided(v, w, m.x, m.y); }

}
function applyNetInput(v) {

function hostStart() {

  const drivers = [{ id: 'host', name: activeProfile().name, car: mpCar(), human: true }];
  for (const id in NET.peers) drivers.push({ id, name: NET.peers[id].name, car: NET.peers[id].car, human: true });
  const humans = drivers.length;
  // computer cars are built to about the same value as the players' cars
  const avg = drivers.reduce((n, d) => n + carValue(d.car), 0) / humans;
  const tier = Math.max(1, ...SERIES.filter((s, i) => S.series[i] && S.series[i].unlocked).map(s => s.tier));
  const taken = drivers.map(d => d.name);
  const names = shuffle(AI_NAMES.filter(n => taken.indexOf(n) < 0));

const PK_BACK = { b: 'bullet', s: 'shell', r: 'rocket', m: 'missile', g: 'guided', f: 'flame', l: 'rail' };
function plain(o) { const out = {}; for (const k in o) { const v = o[k]; if (typeof v === 'number') out[k] = r1(v); else if (typeof v === 'string' || typeof v === 'boolean') out[k] = v; } return out; }
function netHostTick(dt) {
  NET.snapT -= dt;
  if (NET.snapT > 0 || !Object.keys(NET.peers).length) return;
  NET.snapT = 1 / SNAP_HZ;
  const snap = {
    t: 's', time: r3(R.t), go: R.goT, lim: R.limit, over: R.over ? 1 : 0,
    c: R.cars.map(v => [r1(v.x), r1(v.y), r3(v.a), r1(v.vx), r1(v.vy), r1(v.armor.F), r1(v.armor.B), r1(v.armor.L), r1(v.armor.R), r1(v.struct), r1(v.tire),
      (v.wrecked ? 1 : 0) | (v.finished ? 2 : 0) | (v.burnT > 0 ? 4 : 0) | (v.hitFlash > 0 ? 8 : 0) | (v.nitroT > 0 ? 16 : 0),
      v.lap || 0, v.place || 0, v.semi ? r3(v.semi.ta) : 0, r3(v.weapons.filter(w => w.mount === 'turret').map(w => w.rel)[0] || 0), v.kills, r3(v.steer || 0), Math.round(v.prog || 0), v.finishT ? r1(v.finishT) : 0]),
    // ammo for the people's cars (their HUD shows it)
    a: R.cars.filter(v => v.human).map(v => [R.cars.indexOf(v), v.weapons.map(w => w.ammo === Infinity ? -1 : w.ammo), v.droppers.map(d => d.uses)]),
    p: R.proj.slice(-140).map(p => { const a = [PK[p.k] || 'b', Math.round(p.x), Math.round(p.y), Math.round(p.vx), Math.round(p.vy)]; if (p.k === 'flame') a.push(r3(p.life), r3(p.max)); if (p.k === 'guided') a.push(Math.round(p.tx), Math.round(p.ty)); if (p.heavy) a.push(1); return a; }),
    h: R.haz.map(plain), k: R.pickups.map(plain),
    b: R.beams.map(b => [Math.round(b.x1), Math.round(b.y1), Math.round(b.x2), Math.round(b.y2)]),
    e: NET.ev,
  };
  NET.ev = [];
  netSend(snap);
}
// end of a multiplayer match (host): tell everyone the results
function netCheckEnd(racing) {
  if (R.over) return;
  if (R.mode === 'race') {
    const people = R.cars.filter(v => v.human);
    const firstDone = R.cars.filter(v => v.finished).map(v => v.finishT || 0);
    if (people.every(v => v.finished || v.wrecked)) { R.over = true; R.endT = R.t + 3; R.endReason = 'finish'; }
    else if (firstDone.length && R.t - Math.min(...firstDone) > 45 && people.some(v => v.finished)) { R.over = true; R.endT = R.t + 1; R.endReason = 'finish'; }
    else if (R.t > 900) { R.over = true; R.endT = R.t; }
    if (R.player.finished) R.playerAuto = true;
  } else {
    const teamsAlive = new Set(R.cars.filter(v => !v.wrecked).map(v => v.team));
    if (R.teams && !R.cars.some(v => v.human && !v.wrecked)) { R.over = true; R.endT = R.t + 3.2; R.endReason = 'out'; }
    else if (teamsAlive.size <= 1) { R.over = true; R.endT = R.t + 3; R.endReason = 'win'; SFX.play('finish'); }
    else if (racing && R.t - R.goT >= R.limit) { R.over = true; R.endT = R.t + 2.5; R.endReason = 'time'; SFX.play('finish'); }
  }
}
function netRaceOver(cfg, results, reason, tm) {
  if (cfg.net.host) {
    const ids = cfg.net.drivers.map(d => d.id);
    netSend({ t: 'end', results, reason, tm });
    showNetResults(results, reason, tm, 'host');
  }
}

// ---- guest side --------------------------------------------------------------------------
function guestMessage(m) {
  if (m.t === 'lobby') { NET.lobby = m; netRefresh('mpjoin'); }
  else if (m.t === 'nope') { UI.toast(m.why || 'Couldn\'t join that game.'); linkCall('nearbyDisconnect', NET.hostId); NET.hostId = null; NET.lobby = null; netRefresh('mpjoin'); }
  else if (m.t === 'start') { NET.myId = m.cfg.net.id; NET.lastSnap = null; launchNetRace(m.cfg); }
  else if (m.t === 's') { if (R && R.net && !R.netHost) applySnap(m); }
  else if (m.t === 'end') {
    if (R && R.net && !R.netHost) { R.done = true; showControls(false); SFX.engineStop(); R = null; }
    showNetResults(m.results, m.reason, m.tm || {}, NET.myId);
  }
}
function applySnap(m) {
  R.goT = m.go; R.limit = m.lim; R.over = !!m.over;
  // keep our clock close to the host's
  if (Math.abs(R.t - m.time) > 0.25) R.t = m.time; else R.t += (m.time - R.t) * 0.2;
  m.c.forEach((s, i) => {
    const v = R.cars[i]; if (!v) return;
    v.net = { x: s[0], y: s[1], a: s[2] };
    if (!v._seen) { v.x = s[0]; v.y = s[1]; v.a = s[2]; v._seen = true; }
    v.vx = s[3]; v.vy = s[4];
    v.armor.F = s[5]; v.armor.B = s[6]; v.armor.L = s[7]; v.armor.R = s[8]; v.struct = s[9]; v.tire = s[10];
    const f = s[11];
    if ((f & 1) && !v.wrecked) { v.wrecked = true; v.wreckT = 0; }
    v.finished = !!(f & 2); v.burnT = (f & 4) ? 1 : 0; if (f & 8) v.hitFlash = 0.12; v.nitroT = (f & 16) ? Math.max(v.nitroT, 0.2) : 0;
    v.lap = s[12]; v.place = s[13];
    if (v.semi) v.semi.taNet = s[14];
    const tw = v.weapons.find(w => w.mount === 'turret'); if (tw) tw.rel = s[15];
    v.kills = s[16]; if (!v.isPlayer) v.steer = s[17]; v.prog = s[18]; if (s[19]) v.finishT = s[19];
  });
  for (const [i, ammo, uses] of (m.a || [])) {
    const v = R.cars[i]; if (!v) continue;
    ammo.forEach((n, k) => { if (v.weapons[k]) v.weapons[k].ammo = n < 0 ? Infinity : n; });
    uses.forEach((n, k) => { if (v.droppers[k]) v.droppers[k].uses = n; });
  }
  R.proj = m.p.map(a => { const p = { k: PK_BACK[a[0]] || 'bullet', x: a[1], y: a[2], vx: a[3], vy: a[4], life: 1, max: 1 }; p.a = Math.atan2(p.vy, p.vx); if (p.k === 'flame') { p.life = a[5]; p.max = a[6]; } if (p.k === 'guided') { p.tx = a[5]; p.ty = a[6]; } if (a[0] === 'b' && a[5]) p.heavy = true; return p; });
  R.haz = m.h.map(h => Object.assign({ hit: [] }, h));
  R.pickups = m.k;
  R.beams = m.b.map(b => ({ x1: b[0], y1: b[1], x2: b[2], y2: b[3], t: 0.07 }));
  for (const e of m.e || []) {
    if (e[0] === 'x') { explosion(e[1], e[2], e[3]); const d = Math.hypot(R.player.x - e[1], R.player.y - e[2]); if (d < 900) SFX.play('boom', clamp(1 - d / 900, 0.15, 0.8)); }
    else if (e[0] === 'm') msg(e[1], '#ddd');
  }
}
// every frame on a guest phone: smooth the cars toward the host's positions, send our controls
function netGuestStep(dt) {
  const P = R.player;
  R.t += dt;
  for (const v of R.cars) {
    if (v.net) {
      // move along with the car's speed, and ease toward where the host says it is
      v.net.x += v.vx * dt; v.net.y += v.vy * dt;
      const k = 1 - Math.exp(-dt * 12);
      v.x += (v.net.x - v.x) * k + v.vx * dt * (1 - k); v.y += (v.net.y - v.y) * k + v.vy * dt * (1 - k);
      v.a += normA(v.net.a - v.a) * k;
    }
    if (v.semi) {
      const ta = v.semi.taNet != null ? v.semi.taNet : v.a;
      const hx = v.x - Math.cos(v.a) * (v.L / 2 - 8), hy = v.y - Math.sin(v.a) * (v.L / 2 - 8);
      v.semi.rx = hx - Math.cos(ta) * v.semi.D; v.semi.ry = hy - Math.sin(ta) * v.semi.D; updateTrailer(v);
    }
    v.speed = Math.hypot(v.vx, v.vy);
    computeCircles(v);
    if (v.wrecked) { v.wreckT += dt; if (v.wreckT < 6 && Math.random() < dt * 12) puff(v.x + rnd(-6, 6), v.y + rnd(-6, 6), 'fire', 0.5); if (Math.random() < dt * 8) puff(v.x, v.y, 'darksmoke', 0.8); }
    if (v.hitFlash > 0) v.hitFlash -= dt;
    if (v.nitroT > 0) v.nitroT -= dt * 0.2;
  }
  for (const p of R.proj) { p.x += p.vx * dt; p.y += p.vy * dt; if ((p.k === 'rocket' || p.k === 'missile' || p.k === 'guided') && Math.random() < 0.8) R.parts.push({ x: p.x - p.vx * 0.012, y: p.y - p.vy * 0.012, vx: rnd(-15, 15), vy: rnd(-15, 15), life: 0.5, max: 0.5, size: 3.5, grow: 14, type: 'smoke' }); if (p.k === 'flame') p.life = Math.max(0.01, p.life - dt); }
  for (const b of R.beams) b.t -= dt;
  for (const pk of R.pickups) pk.t = (pk.t || 0) + dt;
  updateParticles(dt);
  for (const m of R.msgs) m.t -= dt;
  R.msgs = R.msgs.filter(m => m.t > 0);
  R.shake = Math.max(0, R.shake - dt * 20);
  if (R.aim) { R.aimT -= dt; if (R.aimT <= 0 || P.wrecked) R.aim = false; }
  if (R.aimMark) R.aimMark.t -= dt;
  // our engine note (the host runs the physics, so we drive the sound from the car's speed)
  SFX.engine(Math.hypot(P.vx, P.vy) / Math.max(200, P.st.top), P.nitroT > 0, 0);
  // our controls
  const racing = R.t >= R.goT && !R.over;
  if (!P.wrecked && !P.finished && racing) controlPlayer(P);
  else { P.steer = 0; P.throttle = 0; P.brake = false; P.fire = false; P.drop = false; }
  NET.inT -= dt;
  if (NET.inT <= 0) {
    NET.inT = 1 / INPUT_HZ;
    const inp = { t: 'i', s: r3(P.steer), th: r3(P.throttle), b: P.brake ? 1 : 0, ba: r3(P.brakeAmt || 0), f: P.fire ? 1 : 0, d: P.drop ? 1 : 0 };
    const key = JSON.stringify(inp);
    // send when something changed, and at least 4 times a second anyway
    if (key !== NET.lastInput || (NET.keep = (NET.keep || 0) + 1) % 5 === 0) { NET.lastInput = key; netSend(inp); }
  }
}

// ---- the end, and disconnects ---------------------------------------------------------------
function netDisconnected(id) {
  if (NET.role === 'host') {
    const p = NET.peers[id]; if (!p) return;
    delete NET.peers[id];
    UI.toast(p.name + ' left');
    // their car carries on as a computer car
    if (R && R.cars) { const v = R.cars.find(c => c.nid === id); if (v) { v.nid = null; v.human = false; v.skill = 0.6; v.name += ' (CPU)'; } }
    sendLobby(); netRefresh('mphost');
  } else if (NET.role === 'guest' && id === NET.hostId) {
    NET.hostId = null; NET.lobby = null;
    if (R && R.net) { R.done = true; showControls(false); SFX.engineStop(); R = null; UI.go('mpjoin'); UI.toast('Lost the connection to the host.'); }
    else { UI.toast('The host closed the game.'); netRefresh('mpjoin'); }
  }
}
function showNetResults(results, reason, tm, myId) {
  const me = results.find(r => r.nid === myId) || results.find(r => r.isPlayer) || results[0];
  let place = me.place;
  if (tm.teams) place = tm.teamWon ? 1 : 2;
  const prize = Math.round((tm.teams ? PRIZES[tm.teamWon ? 0 : 2] : PRIZES[Math.min(place, PRIZES.length) - 1]) * MP_PRIZE) + me.kills * Math.round(KILL_BONUS * 0.5);
  S.money += prize; S.stats.races++; S.stats.kills += me.kills; S.stats.earned += prize; if (place === 1) S.stats.wins++;
  save();
  UI.go('mpresults', { results, reason, tm, me, place, prize, myId });
}

Object.assign(ACT, {
  mp() { if (NET.role) netStop(); UI.go('mp'); },
  radio(d) { linkCall('nearbyOpenSettings', d.r); },
  mphost() {
    netReady(() => {
      netStop(); NET.role = 'host';
      linkCall('nearbyHost', activeProfile().name);
      UI.go('mphost');
    });
  },
  mpjoin() {
    netReady(() => {
      netStop(); NET.role = 'guest';
      linkCall('nearbyJoin', activeProfile().name);
      UI.go('mpjoin');
    });
  },
  mpconnect(d) { NET.connecting = d.id; linkCall('nearbyConnect', d.id, activeProfile().name); UI.refresh(); },
  mpkick(d) { netSend({ t: 'nope', why: 'The host removed you from the game.' }, d.id); linkCall('nearbyDisconnect', d.id); delete NET.peers[d.id]; sendLobby(); UI.refresh(); },
  mpset(d) {
    const m = mpSettings();
    if (d.k === 'laps') m.laps = +d.v; else if (d.k === 'tlim') m.tlim = (d.v === 'auto' || d.v === 'none') ? d.v : +d.v; else m[d.k] = d.v;
    if (d.k === 'map') m.tab = mapSize(d.v);
    mpSettings(); mpClampOpp(m); save(); sendLobby(); UI.go('mphost');
  },
  mpopp(d) {
    const m = mpSettings(), x = +d.x;
    if (x > 0 && mpOppTotal(m) >= mpOppCap()) return;
    if (x < 0 && (m.opp[d.d] <= 0 || (m.mode === 'team' && mpOppTotal(m) <= 1))) return;
    m.opp[d.d] += x; save(); sendLobby(); UI.go('mphost');
  },
  mpstart() { hostStart(); },
  mplobby() { if (NET.role === 'host') { sendLobby(); UI.go('mphost'); } else if (NET.role === 'guest') UI.go('mpjoin'); else UI.go('mp'); },
  mpleave() {
    if (R && R.net) { R.done = true; showControls(false); SFX.engineStop(); R = null; }
    if (NET.role === 'guest' && NET.hostId) netSend({ t: 'bye' });
    netStop(); UI.closeModal(); UI.go('title');
  },
});

'use strict';
// ======================================================================
//  Start-up
// ======================================================================
(function boot() {
  loadSave();
  if (NB.call('areAdsRemoved') === true) { S.adsRemoved = true; PROFILES.adsRemoved = true; saveProfiles(); }
  applyLefty();
  setupControls();
  window.addEventListener('resize', () => { if (R) resizeGame(); else if (UI.cur === 'garage' || UI.cur === 'title') UI.refresh(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (R && !R.paused && !R.done) pauseRace(true); SFX.suspend(); } else SFX.resume(); });
  document.addEventListener('pointerdown', () => SFX.init(), { once: true });
  NB.call('requestPrices');
  if (S.firstRun || !S.cars.length) UI.go('starter'); else UI.go('title');
})();

</script>
</body>
