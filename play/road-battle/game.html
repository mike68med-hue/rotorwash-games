];

const CITY_THEMES = {
  city:    { ground: '#3a3c40', ground2: '#2a2b2e', walk: '#9b9a94', curb: '#c9c7bf', roofs: ['#6d7278', '#7c8187', '#5d6267', '#8a8f94', '#55595e', '#6a6f60'], line: '#f2c12e', wall: 'concrete', plaza: '#b9b3a6', label: 'City' },
  oldtown: { ground: '#45403b', ground2: '#2e2a27', walk: '#a59a8a', curb: '#cfc4b2', roofs: ['#8c3b2a', '#9c4a33', '#7a3426', '#a35a3c', '#6e4a38', '#8a5a3a'], line: '#f2f2f2', wall: 'concrete', plaza: '#c2b49c', label: 'Old town' },
  harbor:  { ground: '#3c3f42', ground2: '#2a2c2e', walk: '#8d8f8a', curb: '#b8bab4', roofs: ['#5c6a74', '#6e7b84', '#4f5a62'], line: '#f2c12e', wall: 'concrete', plaza: '#7e8287', label: 'Harbor', containers: true },
};

// ---- Map catalog ---------------------------------------------------------------------
// Codes: '3' / '3r' = built-in circuit (reversed), 'c2' = built-in city arena, 'u<id>' = a map the player designed.
const SIZE_NAMES = { S: 'Small', M: 'Medium', L: 'Large' };
const CIRCUIT_THEME_LABEL = { desert: 'Desert', canyon: 'Canyon', industrial: 'Industrial', snow: 'Snow and ice: less grip!', forest: 'Forest', coast: 'Coast' };
const MAPS_KEY = 'roadbattle_maps';
let customMaps = null;
function loadCustomMaps() {
  if (customMaps) return customMaps;
  try { customMaps = JSON.parse(localStorage.getItem(MAPS_KEY) || '[]'); } catch (e) { customMaps = []; }
  if (!Array.isArray(customMaps)) customMaps = [];
  return customMaps;
}
function saveCustomMaps() { try { localStorage.setItem(MAPS_KEY, JSON.stringify(customMaps || [])); } catch (e) { } }
function isCustomCode(code) { return String(code).charAt(0) === 'u'; }
function customMap(code) { const id = String(code).slice(1); if (typeof NET_MAP !== 'undefined' && NET_MAP && NET_MAP.id === id) return NET_MAP; return loadCustomMaps().find(m => m.id === id) || null; }
function isCityCode(code) {
  if (isCustomCode(code)) { const m = customMap(code); return !!m && m.kind === 'arena'; }
  return String(code).charAt(0) === 'c';
}
function mapExists(code) {
  if (code == null) return false;
  code = String(code);
  if (isCustomCode(code)) return !!customMap(code);
  if (code.charAt(0) === 'c') return !!CITIES[parseInt(code.slice(1), 10)];
  return !!TRACKS[parseInt(code, 10)];
}
function mapName(code) {
  if (isCustomCode(code)) { const m = customMap(code); return m ? m.name : 'Deleted map'; }
  if (isCityCode(code)) return CITIES[parseInt(String(code).slice(1), 10)].name;
  const t = TRACKS[parseInt(code, 10)]; return t.name + (String(code).indexOf('r') >= 0 ? ' (Reverse)' : '');
}
function mapSize(code) {
  if (isCustomCode(code)) { const m = customMap(code); return m ? m.size : 'M'; }
  if (isCityCode(code)) return CITIES[parseInt(String(code).slice(1), 10)].cls;
  return TRACKS[parseInt(code, 10)].size;
}
function mapKindLabel(code) {
  if (isCustomCode(code)) {
    const m = customMap(code); if (!m) return '';
    return 'Your design · ' + SIZE_NAMES[m.size] + ' ' + (m.kind === 'arena' ? CITY_THEMES[m.theme].label.toLowerCase() + ' arena' : (CIRCUIT_THEME_LABEL[m.theme] || '').split(':')[0].toLowerCase() + ' circuit');
  }
  if (isCityCode(code)) { const c = CITIES[parseInt(String(code).slice(1), 10)]; return SIZE_NAMES[c.cls] + ' ' + CITY_THEMES[c.theme].label.toLowerCase() + ' arena: streets and buildings, close-range fighting'; }
  const t = TRACKS[parseInt(code, 10)];
  return SIZE_NAMES[t.size] + ' ' + CIRCUIT_THEME_LABEL[t.theme].replace(/^\w/, ch => ch.toLowerCase()) + ' circuit';
}
// every map of one size (or 'U' for the player's own designs), circuits first
function mapsOfSize(sz, circuitsOnly) {
  const out = [];
  if (sz === 'U') {
    for (const m of loadCustomMaps()) if (!circuitsOnly || m.kind === 'circuit') out.push('u' + m.id);
    return out;
  }
  TRACKS.forEach((t, i) => { if (t.size === sz) out.push(String(i)); });
  if (!circuitsOnly) CITIES.forEach((c, i) => { if (c.cls === sz) out.push('c' + i); });
  return out;
}
// battles last longer on bigger maps
function mapTimeLimit(code) { return ({ S: 200, M: 240, L: 300 })[mapSize(code)] || 240; }
// the battle length the player picked (All vs You always needs a clock to survive)
function battleLimit(code, choice, mode) {
  if (choice === 'none' && mode !== 'hunt') return 1e9;
  if (typeof choice === 'number' && choice > 0) return choice * 60;
  return mapTimeLimit(code);
}
function fmtLimit(sec) { return sec >= 1e8 ? 'no time limit' : Math.floor(sec / 60) + ':' + String(Math.round(sec % 60)).padStart(2, '0'); }
function timeChoiceLabel(c, code) { return c === 'auto' ? 'Auto (' + fmtLimit(mapTimeLimit(code)) + ')' : c === 'none' ? 'No limit' : c + ' min'; }

function buildMap(code) {
  let T;
  if (isCustomCode(code)) {
    const m = customMap(code);
    T = m.kind === 'arena' ? buildArena(m) : buildTrack(code, customTrackDef(m));
  } else T = isCityCode(code) ? buildCity(parseInt(String(code).slice(1), 10)) : buildTrack(code);
  if (!T.kind) T.kind = 'circuit';
  T.code = code;
  if (T.kind === 'circuit') { T.solids = []; }
  buildNav(T);
  return T;
}
function customTrackDef(m) {
  return { name: m.name, theme: THEMES[m.theme] ? m.theme : 'desert', pts: m.pts, seed: (parseInt(m.id, 10) % 9973) + 5 };
}

// ---- City generation ------------------------------------------------------------------
function buildCity(idx) {
  const def = CITIES[idx], th = CITY_THEMES[def.theme];
  const rng = seededRng(def.seed * 7717 + 3);
  const S = def.size, st = def.street;
  const cuts = (len) => {
    const out = []; let x = 0;
    while (true) {
      out.push([x, x + st]); x += st;              // street
      const bw = def.block[0] + rng() * (def.block[1] - def.block[0]);
      const rem = len - st - x;                     // room left for blocks before the edge street
      if (rem < bw + st + def.block[0]) { out.push([x, len - st]); out.push([len - st, len]); break; }
      out.push([x, x + bw]); x += bw;              // block
    }
    return out;
  };
  const xs = cuts(S), ys = cuts(S);
  const T = { kind: 'city', name: def.name, cityTheme: th, theme: { ground: th.ground, ground2: th.ground2 }, themeKey: def.theme, size: S, street: st };
  T.bounds = { minx: -60, miny: -60, maxx: S + 60, maxy: S + 60 };
  T.blocks = []; T.solids = []; T.deco = []; T.streets = [];
  for (let i = 0; i < xs.length; i++) for (let j = 0; j < ys.length; j++) {
    const bx = xs[i], by = ys[j];
    const isStreetX = i % 2 === 0, isStreetY = j % 2 === 0;
    if (isStreetX || isStreetY) continue;
    const b = { x: bx[0], y: by[0], w: bx[1] - bx[0], h: by[1] - by[0] };
    const r = rng();
    const walk = 16;
    if (r < def.plaza) {
      b.type = 'plaza';
      const fr = Math.min(b.w, b.h) * 0.13 + 16;
      b.fountain = { x: b.x + b.w / 2, y: b.y + b.h / 2, r: fr };
      T.solids.push({ c: true, x: b.fountain.x, y: b.fountain.y, r: fr + 6 });
      for (let k = 0; k < 4; k++) {
        const tx = b.x + (k % 2 ? b.w - 34 : 34), ty = b.y + (k > 1 ? b.h - 34 : 34);
        T.solids.push({ c: true, x: tx, y: ty, r: 14 });
        T.deco.push({ type: 'tree', x: tx, y: ty, s: 1 + rng() * 0.3, rot: rng() * 6 });
      }
    } else if (r < def.plaza + def.lot) {

// ---- Player-designed arenas ----------------------------------------------------------
// A square grid of cells: '0' street, '1' building, '2' concrete barrier, '3' tree.
const ARENA_CELL = 120;
const ARENA_N = { S: 14, M: 20, L: 28 };
// Which open cells can cars reach from each other, and where do they start?
function arenaAnalyze(n, cells) {
  const open = (k) => cells.charAt(k) === '0';
  const seen = new Int16Array(n * n).fill(-1);
  let best = -1, bestSize = 0, region = 0;
  const sizes = [];
  for (let k = 0; k < n * n; k++) {
    if (!open(k) || seen[k] >= 0) continue;
    const q = [k]; seen[k] = region; let cnt = 0;
    while (q.length) {
      const c = q.pop(); cnt++;
      const x = c % n, y = (c / n) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= n || ny >= n) continue;
        const nk = ny * n + nx; if (open(nk) && seen[nk] < 0) { seen[nk] = region; q.push(nk); }
      }
    }
    sizes.push(cnt); if (cnt > bestSize) { bestSize = cnt; best = region; } region++;
  }
  let openCount = 0; for (let k = 0; k < n * n; k++) if (open(k)) openCount++;
  const main = []; for (let k = 0; k < n * n; k++) if (seen[k] === best && best >= 0) main.push(k);
  // starting spots: the open cell furthest from the middle in each of 16 directions
  const c0 = (n - 1) / 2, buckets = new Array(16).fill(null);
  for (const k of main) {
    const x = k % n, y = (k / n) | 0, d = Math.hypot(x - c0, y - c0);
    const b = Math.floor(((Math.atan2(y - c0, x - c0) + Math.PI) / (Math.PI * 2)) * 16) % 16;
    if (!buckets[b] || d > buckets[b].d) buckets[b] = { k, d };
  }
  const spawns = buckets.filter(Boolean).map(b => b.k);
  // too few? add open cells far from the ones already picked
  const pool = main.slice();
  while (spawns.length < 12 && spawns.length < pool.length) {
    let bk = -1, bd = -1;
    for (const k of pool) {
      if (spawns.indexOf(k) >= 0) continue;
      let md = 1e9; for (const s2 of spawns) md = Math.min(md, Math.hypot(k % n - s2 % n, ((k / n) | 0) - ((s2 / n) | 0)));
      if (md > bd) { bd = md; bk = k; }
    }
    if (bk < 0) break; spawns.push(bk);
  }
  return { main, mainCount: main.length, openCount, cutOff: openCount - main.length, spawns };
}

function buildArena(m) {
  const n = m.n, cells = m.cells, CELL = ARENA_CELL, S = n * CELL;
  const th = CITY_THEMES[m.theme] || CITY_THEMES.city;
  const rng = seededRng((parseInt(m.id, 10) % 9973) * 31 + 7);
  const T = { kind: 'city', custom: true, name: m.name, cityTheme: th, theme: { ground: th.ground, ground2: th.ground2 }, themeKey: m.theme, size: S, street: CELL };
  T.bounds = { minx: -60, miny: -60, maxx: S + 60, maxy: S + 60 };
  T.blocks = []; T.solids = []; T.deco = []; T.streets = [];
  const at = (x, y) => (x < 0 || y < 0 || x >= n || y >= n) ? '' : cells.charAt(y * n + x);
  // merge building cells into rectangles so each block gets one roof
  const used = new Uint8Array(n * n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (at(x, y) !== '1' || used[y * n + x]) continue;
    let w = 1; while (x + w < n && at(x + w, y) === '1' && !used[y * n + x + w] && w < 4) w++;
    let h = 1;
    while (y + h < n && h < 4) { let ok = true; for (let i = 0; i < w; i++) if (at(x + i, y + h) !== '1' || used[(y + h) * n + x + i]) { ok = false; break; } if (!ok) break; h++; }
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) used[(y + j) * n + x + i] = 1;
    const walk = 12;
    const b = { type: 'buildings', custom: true, x: x * CELL, y: y * CELL, w: w * CELL, h: h * CELL, walk };
    const p = { x: b.x + walk, y: b.y + walk, w: b.w - walk * 2, h: b.h - walk * 2, roof: th.roofs[Math.floor(rng() * th.roofs.length)], h3: 6 + rng() * 14,
      details: Array.from({ length: 1 + Math.floor(rng() * 3 * Math.min(w * h, 3)) }, () => ({ u: 0.15 + rng() * 0.6, v: 0.15 + rng() * 0.6, k: Math.floor(rng() * 3), s: 0.6 + rng() * 0.6 })) };
    b.parts = [p]; T.solids.push({ x: p.x, y: p.y, w: p.w, h: p.h });
    T.blocks.push(b);
  }
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = at(x, y), cx = x * CELL, cy = y * CELL;
    if (v === '2') {
      // concrete barrier: runs the way its neighbours run (side to side unless stacked up and down)
      const vert = (at(x, y - 1) === '2' || at(x, y + 1) === '2') && !(at(x - 1, y) === '2' || at(x + 1, y) === '2');
      const bar = vert ? { x: cx + CELL / 2 - 14, y: cy, w: 28, h: CELL } : { x: cx, y: cy + CELL / 2 - 14, w: CELL, h: 28 };
      T.blocks.push({ type: 'bar', x: cx, y: cy, w: CELL, h: CELL, bar: [bar] }); T.solids.push(bar);
    } else if (v === '3') {
      const tx = cx + CELL / 2, ty = cy + CELL / 2;
      T.solids.push({ c: true, x: tx, y: ty, r: 30 });
      T.deco.push({ type: 'tree', x: tx, y: ty, s: 1.45 + rng() * 0.2, rot: rng() * 6 });
    }
  }
  const an = arenaAnalyze(n, cells);
  const c = S / 2;
  T.spawns = an.spawns.map(k => { const x = (k % n + 0.5) * CELL, y = (((k / n) | 0) + 0.5) * CELL; return { x, y, a: Math.atan2(c - y, c - x) }; });
  // keep spawn order going round the map so spread-out slots stay spread out
  T.spawns.sort((a, b) => Math.atan2(a.y - c, a.x - c) - Math.atan2(b.y - c, b.x - c));
  cityFinish(T, (parseInt(m.id, 10) % 997) + 3);
  return T;
}


function sidewalkTile(col) {

// ---- Angled 3D view: buildings with walls -----------------------------------------------
// The camera looks along camA, so a building's roof appears shifted that way (up the screen),

function drawCityTall(c, T, view, camA) {
  const r = view.r + 200, ux = Math.cos(camA), uy = Math.sin(camA);
  const list = [];
  for (const b of T.blocks) {
    if (b.type !== 'buildings') continue;
    if (Math.abs(b.x + b.w / 2 - view.x) > r + b.w || Math.abs(b.y + b.h / 2 - view.y) > r + b.h) continue;

function drawTallBuilding(c, p, ux, uy) {

      const t0 = (w + 0.3) / cols, t1 = (w + 0.7) / cols, k0 = (f + 0.3) / floors, k1 = (f + 0.7) / floors;
      const P = (t, k) => [a[0] + (b[0] - a[0]) * t + ox * k, a[1] + (b[1] - a[1]) * t + oy * k];

// Is a point blocked (inside a building/obstacle or outside the arena)? Used for bullets and sight lines.
function mapBlocked(T, x, y, pad) {

  if (x < pad || y < pad || x > T.size - pad || y > T.size - pad) return true;
  for (const s of T.solids) {

  }
  return false;
}

// line of sight between two points (bullets would get through)

    if (px || py) { applyPush(v, cc, px, py); hit++; hx = cc.x - px; hy = cc.y - py; }

      let dx, dy, d, r = cc.r;

        dx = cc.x - s.x; dy = cc.y - s.y; d = Math.hypot(dx, dy);

function applyPush(v, cc, px, py) {
  if (cc.tr && v.semi) { v.semi.rx += px * 1.4; v.semi.ry += py * 1.4; updateTrailer(v); }

  // teams: you + the first few drivers (your teammates) against the rest;
  // All vs You: every other car is on one side, hunting you; otherwise every car for itself
  R.teams = R.mode === 'team';
  R.hunt = R.mode === 'hunt';
  const mates = R.teams ? (cfg.mates != null ? cfg.mates : 2) : 0;
  P.team = 0;
  field.forEach((v, i) => { v.team = R.teams ? (i < mates ? 0 : 1) : R.hunt ? 1 : i + 1; v.ally = R.teams && v.team === 0; });
  // everyone starts spread around the map (in team battles, teammates start together)
  const order = [P].concat(field);
  if (R.mode === 'race') {
    // lap race: starting grid, player in the middle of the pack
    const grid = field.slice(); grid.splice(Math.min(grid.length, 3), 0, P);
    grid.forEach((v, i) => { placeOnGrid(v, T, i); computeCircles(v); R.cars.push(v); });
    R.limit = 1e9;
  } else {
    const n = order.length;
    if (R.hunt) {
      // you start alone, with a gap either side; the hunters are spread around the rest of the map
      const cnt = n + 2;
      order.forEach((v, i) => { spawnVehicle(v, T, i === 0 ? 0 : 1.5 + (i - 1) * ((cnt - 3) / Math.max(1, n - 2)), cnt); R.cars.push(v); });
    } else {
      // teams take neighbouring slots (allies side by side, enemies across the map)
      order.forEach((v, i) => { spawnVehicle(v, T, i, n); R.cars.push(v); });
    }
    for (let k = 0; k < 2; k++) spawnPickup(k ? 'repair' : 'ammo');
  }

}
function startRaceView(P) {
  const vw = curView();
  R.cam.x = P.x; R.cam.y = P.y; R.cam.a = vw.rotate ? P.a : -Math.PI / 2; R.cam.oy = vw.oy;
  resizeGame();
  // start at the chosen view's zoom
  R.cam.z = clamp(Math.min(R.sw / 330, R.sh / 640), 0.7, 1.9) * (P.semi ? 0.85 : 1) * vw.zoom;
  syncViewUI();
  showControls(true);
  SFX.engineStart(({ semi: 0.66, dually: 0.8, pickup: 0.85, suv: 0.85, muscle: 0.92, sports: 1.15, supercar: 1.28, compact: 1.12 })[P.car.body] || 1);
  SFX.music('race'); SFX.duckMusic(false);
  R.lastFrame = performance.now();
  requestAnimationFrame(raceLoop);
}

// Multiplayer: every phone builds the same field from the host's driver list, in the same order,
// so car number i is the same car everywhere. cfg.net.me says which one is this phone's.
function startNetField(cfg, T) {
  const net = cfg.net;
  R.mode = cfg.mode || 'ffa'; R.laps = cfg.laps || LAPS; R.teams = R.mode === 'team'; R.hunt = false;
  R.net = net; R.netHost = !!net.host;
  const mine = net.drivers[net.me];
  net.drivers.forEach((d, i) => {
    const me = i === net.me;
    let v;
    if (d.human) {
      v = makeVehicle(d.car, d.name, me, 1);
      v.human = true; v.nid = d.id;
      if (!me) v.bst = { freeNitro: 1 + (v.acc.ntk ? 1 : 0), used: { nitro: 0, repair: 0, ammo: 0 } };
    } else {
      const df = DIFFS[d.diff] || DIFFS.medium;
      v = makeVehicle(d.car, d.name, false, clamp(cfg.skill + df.skill, 0.08, 0.97), d.style);
      v.diff = DIFFS[d.diff] ? d.diff : 'medium'; v.spdMul = df.speed; v.dmgMul = df.dmg;
    }
    v.netIdx = i; v.team = d.team; v.ally = R.teams && !me && d.team === mine.team;
    v.input = { s: 0, th: 0, b: false, ba: 0, f: false, d: false };
    R.cars.push(v);
    if (me) R.player = v;
  });
  if (R.mode === 'race') { R.cars.forEach((v, i) => { placeOnGrid(v, T, i); computeCircles(v); }); R.limit = 1e9; }
  else {
    R.cars.forEach((v, i) => spawnVehicle(v, T, i, R.cars.length));
    if (R.netHost) for (let k = 0; k < 2; k++) spawnPickup(k ? 'repair' : 'ammo');
  }
  startRaceView(R.player);
}

function raceLoop(now) {
  if (!R) return;
  let dt = (now - R.lastFrame) / 1000; R.lastFrame = now;
  if (dt > 0.05) dt = 0.05;
  if (R.net && !R.netHost) netGuestStep(dt);
  else if (!R.paused || R.net) {
    // fixed sub-steps for stable collisions
    const steps = dt > 0.025 ? 2 : 1;
    for (let i = 0; i < steps && R && !R.done; i++) updateRace(dt / steps);
  }
  if (!R || R.done) return;
  if (R.netHost) netHostTick(dt);
  renderRace(dt);
  if (R && !R.done) requestAnimationFrame(raceLoop);
}

function pauseRace(p) {
  if (!R || R.done) return;
  R.paused = p;
  SFX.engineVol(p ? 0 : 1); SFX.duckMusic(p);
  UI.pauseOverlay(p);
}

// ---------------------------------------------------------------------------------------
function updateRace(dt) {
  const T = R.T;
  R.t += dt;
  const racing = R.t >= R.goT;
  // guided rocket aiming: armed for a few seconds; a tap made while reloading fires when ready
  if (R.aim) { R.aimT -= dt; if (R.aimT <= 0 || R.player.wrecked) R.aim = false; }
  if (R.aimQueued) { const q = R.aimQueued; if (q.w.ammo <= 0 || R.player.wrecked) R.aimQueued = null; else if (q.w.cd <= 0) { fireGuided(R.player, q.w, q.tx, q.ty); R.aimQueued = null; } }
  // countdown beeps
  const cd = Math.ceil(R.goT - R.t);
  if (cd !== R.beep && cd >= 0 && cd <= 3) { R.beep = cd; if (cd > 0) SFX.play('beep'); else SFX.play('go'); }

  for (const v of R.cars) {
    if (v.wrecked) { v.wreckT += dt; continue; }
    if (v.isPlayer && !v.finished && !R.playerAuto) controlPlayer(v);
    else if (v.human && v.nid && !v.finished) applyNetInput(v);
    else if (R.mode === 'race') controlRaceAI(v, dt);
    else controlAI(v, dt);
    if (!racing) { v.throttle = 0; v.fire = false; v.drop = false; v.brake = false; v.steer = 0; }
  }
  for (const v of R.cars) physics(v, dt);
  collideCars();
  for (const v of R.cars) { if (R.mode === 'race') updateLap(v); if (!v.wrecked && racing) combat(v, dt); }
  updateProjectiles(dt);
  updateHazards(dt);
  updateParticles(dt);
  if (racing && R.mode !== 'race') updatePickups(dt);
  const P = R.player;
  if (R.mode === 'race' && !R.net) {
    // mild catch-up so the pack stays together
    for (const v of R.cars) {
      if (v.isPlayer) continue;
      const d = (v.prog - P.prog) / T.N;
      v.rubber = d < -0.18 ? 1.07 : d > 0.25 ? 0.95 : 1;
    }
  }
  // messages
  for (const m of R.msgs) m.t -= dt;
  R.msgs = R.msgs.filter(m => m.t > 0);
  R.shake = Math.max(0, R.shake - dt * 20);
  if (R.net) netCheckEnd(racing);
  else if (R.mode === 'race') {
    if (!R.over && (P.finished || P.wrecked)) {
      R.over = true; R.endT = R.t + (P.wrecked ? 3.2 : 3); R.endReason = P.wrecked ? 'out' : 'finish';
      if (P.finished) { R.playerAuto = true; SFX.play('finish'); }
    }
    if (R.t > 900 && !R.over) { R.over = true; R.endT = R.t; }
  }
  // last vehicle standing
  else if (!R.over) {
    const teamsAlive = new Set(R.cars.filter(v => !v.wrecked).map(v => v.team));
    const myTeamAlive = teamsAlive.has(P.team);
    if (!myTeamAlive || (P.wrecked && !R.teams)) { R.over = true; R.endT = R.t + 3.2; R.endReason = 'out'; }
    else if (teamsAlive.size <= 1) { R.over = true; R.endT = R.t + 3; R.endReason = 'win'; SFX.play('finish'); }
    else if (racing && R.t - R.goT >= R.limit) { R.over = true; R.endT = R.t + 2.5; R.endReason = 'time'; SFX.play('finish'); }
  }
  if (R.over && R.t >= R.endT) endRace();
}

function controlPlayer(v) {
  // joystick: left/right steers, up = gas, down = brake (and reverse when stopped)
  let jx = INPUT.jx, jy = INPUT.jy;
  // touch-to-drive: touch the road ahead of the car (front, front-left, front-right) to drive
  // there at full speed; touch behind the car to brake and back up. The joystick wins if both are used.
  if (INPUT.touch && !jx && !jy) {
    // where the touch is relative to the car (works in every camera view):
    // fwd > 0 = ahead of the car, side > 0 = to its right
    const [wx, wy] = screenToWorld(INPUT.tx, INPUT.ty);
    const ox = wx - v.x, oy = wy - v.y, ca = Math.cos(v.a), sa = Math.sin(v.a);
    const dx = -ox * sa + oy * ca, dy = -(ox * ca + oy * sa);
    const dist = Math.hypot(dx, dy);
    // throttle grows evenly with distance from the car: 3 car-lengths away (or more) = full throttle
    const carLen = v.L;
    const amount = clamp(dist / (3 * carLen), 0, 1);
    if (dist > carLen * 0.25) {
      // steering also grows evenly with how far left/right of the car you touch:
      // 3 car-lengths to the side (or more) = full lock
      const side = Math.abs(dx) < carLen * 0.15 ? 0 : clamp(dx / (3 * carLen), -1, 1);
      if (dy < 0) { jx = side; jy = amount; }
      else { jx = -side; jy = -Math.max(0.25, amount); }   // behind the car: back up toward the touch
    }
  }
  // top-down views: the joystick points where you want to go (the car turns to face that way)
  let absSteer = null;
  if (!curView().rotate && (INPUT.jx || INPUT.jy)) {
    const mag = Math.min(1, Math.hypot(INPUT.jx, INPUT.jy));
    const want = Math.atan2(-INPUT.jy, INPUT.jx), diff = normA(want - v.a);
    const fwdSpeed = v.vx * Math.cos(v.a) + v.vy * Math.sin(v.a);
    if (Math.abs(diff) > 2.3 && fwdSpeed < 90) { absSteer = -Math.sign(diff); jy = -Math.max(0.5, mag); }   // facing away: back up and swing round
    else { absSteer = clamp(diff * 1.8, -1, 1); jy = mag * (Math.abs(diff) > 1.4 ? 0.7 : 1); }
    jx = absSteer;
  }
  if (INPUT.left || INPUT.right) { jx = (INPUT.left ? -1 : 0) + (INPUT.right ? 1 : 0); absSteer = null; }
  if (INPUT.up) jy = 1; else if (INPUT.brake) jy = -1;
  v.steer = absSteer !== null ? absSteer : (INPUT.touch && !INPUT.jx && !INPUT.jy) ? jx : Math.sign(jx) * Math.pow(Math.abs(jx), 1.3);
  if (jy > 0.08) { v.throttle = Math.min(1, INPUT.touch && !INPUT.jx && !INPUT.jy ? jy : jy * 1.15); v.brake = false; }
  else if (jy < -0.2 || (jy < 0 && INPUT.touch)) { v.throttle = 0; v.brake = true; v.brakeAmt = Math.min(1, -jy * 1.2); }
  else { v.throttle = 0; v.brake = false; }
  v.fire = INPUT.fire;
  v.drop = INPUT.drop;
}

// Battle AI: pick a target (or a pickup when low on ammo/health), find a route around
// buildings and walls, line up front guns, drop hazards on anyone tailing them.
function controlAI(v, dt) {
  const T = R.T, sk = v.skill;
  const ai = v.ai || (v.ai = { stuckT: 0, revT: 0, dropT: rnd(2, 5), react: 0, nitroT: rnd(6, 25), tgtT: 0, pathT: 0, path: null, pi: 0 });
  const speed = Math.hypot(v.vx, v.vy);
  const sty = STYLES_AI[v.style] || STYLES_AI.balanced;
  v.fire = false; v.drop = false;
  // aggressive drivers go after whoever hurt them; others pick a target: the nearest living rival, re-checked every couple of seconds
  ai.tgtT -= dt;
  if (ai.tgtT <= 0 || !ai.tgt || ai.tgt.wrecked) {
    let best = null, bd = 1e9;
    for (const o of R.cars) {
      if (!isEnemy(v, o) || o.wrecked) continue;
      // spread out: a car that's already being chased by others is a less attractive target
      const hunters = R.cars.filter(h => h !== v && !h.wrecked && h.ai && h.ai.tgt === o).length;
      let d = Math.hypot(o.x - v.x, o.y - v.y) * rnd(0.8, 1.2) * (1 + 0.6 * hunters);
      if (v.style === 'aggressive') { if (o === v.lastBy) d *= 0.5; d *= 0.6 + 0.4 * (o.struct / o.structMax); }   // revenge, and finish off weak cars
      if (v.style === 'defensive' && o === v.lastBy) d *= 0.6;                                                      // fight back at whoever is shooting
      if (d < bd) { bd = d; best = o; }
    }
    ai.tgt = best; ai.tgtT = rnd(1.5, 3);
  }
  const ammoLeft = v.weapons.some(w => w.ammo > 0);
  const hpFrac = v.struct / v.structMax;
  let goal = ai.tgt, goalKind = 'enemy';
  const wantType = (!ammoLeft && v.weapons.length) ? 'ammo' : hpFrac < sty.repairAt ? 'repair' : null;
  if (wantType) {
    let bp = null, bd = 1100;
    for (const pk of R.pickups) { if (pk.type !== wantType) continue; const d = Math.hypot(pk.x - v.x, pk.y - v.y); if (d < bd) { bd = d; bp = pk; } }
    if (bp) { goal = bp; goalKind = 'pickup'; }
  }
  // defensive drivers keep their distance, and back off to safety when hurt
  if (goalKind === 'enemy' && goal && (sty.keepAway || sty.flee)) {
    const dT = Math.hypot(goal.x - v.x, goal.y - v.y);
    const hurt = hpFrac < sty.flee;
    if (dT < sty.keepAway || (hurt && dT < 600)) {
      ai.fleeT = (ai.fleeT || 0) - dt;
      if (!ai.flee || ai.fleeT <= 0 || Math.hypot(ai.flee.x - v.x, ai.flee.y - v.y) < 80) {
        const [fx, fy] = randomFreePoint(T, R.cars.filter(o => isEnemy(v, o) && !o.wrecked), 480);
        ai.flee = { x: fx, y: fy, vx: 0, vy: 0 }; ai.fleeT = rnd(2, 3.5);
      }
      goal = ai.flee; goalKind = 'flee';
    }
  }
  if (!goal) { v.throttle = 0; v.brake = true; v.steer = 0; return; }
  // route
  const dGoal = Math.hypot(goal.x - v.x, goal.y - v.y);
  let wx = goal.x, wy = goal.y;
  const direct = dGoal < 450 && navClear(T, v.x, v.y, goal.x, goal.y);
  if (!direct) {
    ai.pathT -= dt;
    if (ai.pathT <= 0 || !ai.path || ai.goal !== goal) { ai.path = findPath(T, v.x, v.y, goal.x, goal.y); ai.pi = 0; ai.pathT = rnd(0.5, 0.9); ai.goal = goal; }
    const path = ai.path;
    if (path && path.length) {
      while (ai.pi < path.length - 1 && Math.hypot(path[ai.pi][0] - v.x, path[ai.pi][1] - v.y) < 70) ai.pi++;
      let bi = ai.pi;
      for (let k = ai.pi + 1; k < Math.min(path.length, ai.pi + 10); k++) { if (navClear(T, v.x, v.y, path[k][0], path[k][1])) bi = k; else break; }
      wx = path[bi][0]; wy = path[bi][1];
    }
  }
  const want = Math.atan2(wy - v.y, wx - v.x);
  const diff = normA(want - v.a);
  v.steer = clamp(diff * (2.2 + sk), -1, 1);
  // speed: slow down for sharp turns; ease off when right behind a target (unless built to ram)
  let cap = v.st.top;
  const ad = Math.abs(diff);
  if (ad > 1.4) cap = 130; else if (ad > 0.7) cap = 230; else if (ad > 0.35) cap = 360;
  // dogfighting: when a rival is close but not in front, slow right down to turn tight and face it
  if (goalKind === 'enemy' && dGoal < 320 && ad > 0.45) cap = Math.min(cap, 105);
  // balanced/defensive drivers hold back behind a target; aggressive ones charge in (and ram)
  if (goalKind === 'enemy' && direct && dGoal < 190 && ammoLeft && !v.acc.ram && v.style !== 'aggressive' && ad < 0.45) cap = Math.min(cap, Math.hypot(goal.vx, goal.vy) + 30);
  if (T.themeKey === 'snow') cap *= 0.9;
  v.throttle = speed < cap ? 1 : 0;
  v.brake = speed > cap + 50;
  // stuck: back up and turn
  if (R.t > R.goT + 1.5 && speed < 22) ai.stuckT += dt; else ai.stuckT = 0;
  if (ai.stuckT > 0.9) { ai.revT = rnd(0.7, 1.2); ai.stuckT = 0; ai.pathT = 0; }
  if (ai.revT > 0) { ai.revT -= dt; v.throttle = 0; v.brake = true; v.brakeAmt = 1; v.steer = -Math.sign(diff) || 1; }
  // weapons
  const inSmoke = R.haz.some(h => h.type === 'smoke' && Math.hypot(h.x - v.x, h.y - v.y) < h.r);
  if (!inSmoke) {
    const cone = 0.2 + 0.12 * sk + (v.acc.tgt ? 0.06 : 0) + sty.cone;
    let wantFire = false;
    for (const w of v.weapons) {
      if (w.ammo <= 0) continue;
      if (w.mount === 'turret') { if (w.tgt) wantFire = true; continue; }
      const t = findTarget(v, v.a, cone + 0.12, w.def.range * 0.95);
      if (t && !behindSmoke(v, t)) wantFire = true;
    }
    // fire in bursts; better drivers hold the trigger longer
    ai.burst = (ai.burst === undefined ? rnd(0, 2) : ai.burst) - dt;
    if (ai.burst < -(0.6 + (1 - sk) * 2.4) * (STYLES_AI[v.style] || STYLES_AI.balanced).burstOff) ai.burst = (0.8 + sk * 1.6) * (STYLES_AI[v.style] || STYLES_AI.balanced).burstOn;
    if (wantFire) { ai.react += dt; if (ai.react > 0.45 - sk * 0.35 && ai.burst > 0) v.fire = true; }
    else ai.react = Math.max(0, ai.react - dt * 2);
  }
  ai.dropT -= dt;
  if (ai.dropT <= 0 && R.t > R.goT + 4 && v.droppers.some(d => d.uses > 0)) {
    for (const o of R.cars) {
      if (!isEnemy(v, o) || o.wrecked) continue;
      const dx = o.x - v.x, dy = o.y - v.y, d = Math.hypot(dx, dy);
      if (d < 260 && Math.abs(normA(Math.atan2(dy, dx) - v.a - Math.PI)) < 0.55) { v.drop = true; ai.dropT = rnd(2.5, 6) * (1.3 - sk) / (STYLES_AI[v.style] || STYLES_AI.balanced).drop; break; }
    }
  }
  // boosts
  ai.nitroT -= dt;
  if (v.bst.freeNitro > 0 && ai.nitroT <= 0 && ad < 0.2 && R.t > R.goT + 4 &&
      (dGoal > 500 || (sty.nitroChase && goalKind === 'enemy' && dGoal > 200) || goalKind === 'flee')) { useNitro(v); ai.nitroT = rnd(12, 30); }
  if (v.bst.repairs > 0 && v.struct < v.structMax * 0.35) { v.bst.repairs--; applyRepairKit(v); }
}

// Lap-race AI: follows the racing line, overtakes, fights whoever is close
function controlRaceAI(v, dt) {
  const T = R.T, N = T.N, sk = v.skill;
  const ai = v.ai || (v.ai = { lane: rnd(-55, 55), laneT: rnd(1, 4), stuckT: 0, revT: 0, dropT: rnd(2, 5), react: 0, fireT: 0, nitroT: rnd(6, 25) });
  const speed = Math.hypot(v.vx, v.vy);
  ai.laneT -= dt;
  if (ai.laneT <= 0) { ai.lane = rnd(-60, 60); ai.laneT = rnd(2, 5); }
  let lane = ai.lane;
  // chase a nearby rival ahead to line up a shot (more aggressive drivers do this more)
  if (!v.finished && v.weapons.some(w => w.mount === 'front')) {
    for (const o of R.cars) {
      if (o === v || o.wrecked) continue;
      const dx = o.x - v.x, dy = o.y - v.y, d = Math.hypot(dx, dy);
      if (d < 360 && d > 40) {
        const ang = Math.abs(normA(Math.atan2(dy, dx) - v.a));
        if (ang < 0.9) { lane = lerp(lane, clamp(o.near.lat, -80, 80), clamp((0.35 + sk * 0.45) * (STYLES_AI[v.style] || STYLES_AI.balanced).chase, 0, 1)); break; }
      }
    }
  }
  // dodge hazards ahead
  for (const h of R.haz) {
    if (h.type === 'smoke') continue;
    const dx = h.x - v.x, dy = h.y - v.y, d = Math.hypot(dx, dy);
    if (d < 300 && d > 10 && Math.abs(normA(Math.atan2(dy, dx) - v.a)) < 0.5 && Math.random() < 0.5 + sk * 0.5) {
      const hn = nearestNear(T, h.x, h.y, v.near.i, 40);
      lane = hn.lat > 0 ? hn.lat - 95 : hn.lat + 95;
      lane = clamp(lane, -95, 95);
      break;
    }
  }
  const look = Math.floor(11 + speed / 14);
  const li = (v.near.i + look) % N;
  const tp = T.pts[li], tn = T.nrm[li];
  const tx = tp[0] + tn[0] * lane, ty = tp[1] + tn[1] * lane;
  const want = Math.atan2(ty - v.y, tx - v.x);
  const diff = normA(want - v.a);
  v.steer = clamp(diff * (2.2 + sk), -1, 1);
  // corner speed
  let curv = 0;
  for (let k = 4; k < look + 26; k += 4) curv = Math.max(curv, T.curv[(v.near.i + k) % N]);
  const corner = lerp(640, 175, clamp(curv / 1.25, 0, 1)) * (0.8 + 0.22 * sk) * (T.themeKey === 'snow' ? 0.9 : 1);
  v.throttle = 1;
  v.brake = speed > corner + 25;
  // stuck: back up
  if (R.t > R.goT + 2 && speed < 22 && !v.finished) ai.stuckT += dt; else ai.stuckT = 0;
  if (ai.stuckT > 1.1) { ai.revT = 0.9; ai.stuckT = 0; }
  if (ai.revT > 0) { ai.revT -= dt; v.brake = true; v.steer = -Math.sign(diff) || 1; }
  // weapons
  v.fire = false; v.drop = false;
  if (v.finished) return;
  const inSmoke = R.haz.some(h => h.type === 'smoke' && Math.hypot(h.x - v.x, h.y - v.y) < h.r);
  if (!inSmoke) {
    const cone = 0.1 + 0.1 * sk + (v.acc.tgt ? 0.06 : 0);
    let wantFire = false;
    for (const w of v.weapons) {
      if (w.ammo <= 0) continue;
      if (w.mount === 'turret') { if (w.tgt) wantFire = true; continue; }
      const t = findTarget(v, v.a, cone + 0.12, w.def.range * 0.95);
      if (t && !behindSmoke(v, t)) wantFire = true;
    }
    // fire in bursts; better drivers hold the trigger longer
    ai.burst = (ai.burst === undefined ? rnd(0, 2) : ai.burst) - dt;
    if (ai.burst < -(0.6 + (1 - sk) * 2.4) * (STYLES_AI[v.style] || STYLES_AI.balanced).burstOff) ai.burst = (0.8 + sk * 1.6) * (STYLES_AI[v.style] || STYLES_AI.balanced).burstOn;
    if (wantFire) { ai.react += dt; if (ai.react > 0.45 - sk * 0.35 && ai.burst > 0) v.fire = true; }
    else ai.react = Math.max(0, ai.react - dt * 2);
  }
  ai.dropT -= dt;
  if (ai.dropT <= 0 && R.t > R.goT + 6 && v.droppers.some(d => d.uses > 0)) {
    for (const o of R.cars) {
      if (o === v || o.wrecked) continue;
      const dx = o.x - v.x, dy = o.y - v.y, d = Math.hypot(dx, dy);
      if (d < 260 && Math.abs(normA(Math.atan2(dy, dx) - v.a - Math.PI)) < 0.55) { v.drop = true; ai.dropT = rnd(2.5, 6) * (1.3 - sk) / (STYLES_AI[v.style] || STYLES_AI.balanced).drop; break; }
    }
  }
  // boosts
  ai.nitroT -= dt;
  if (v.bst.freeNitro > 0 && ai.nitroT <= 0 && curv < 0.25 && R.t > R.goT + 4) { useNitro(v); ai.nitroT = rnd(12, 30); }
  if (v.bst.repairs > 0 && v.struct < v.structMax * 0.35) { v.bst.repairs--; applyRepairKit(v); }
}

function behindSmoke(v, t) {
  for (const h of R.haz) {
    if (h.type !== 'smoke') continue;
    // distance from smoke centre to the line of fire
    const ax = t.x - v.x, ay = t.y - v.y, l2 = ax * ax + ay * ay || 1;
    const u = clamp(((h.x - v.x) * ax + (h.y - v.y) * ay) / l2, 0, 1);
    if (Math.hypot(v.x + ax * u - h.x, v.y + ay * u - h.y) < h.r * 0.8) return true;
  }
  return false;
}

// nearest living enemy inside a cone (angle measured from 'base')
function findTarget(v, base, cone, range, fromX, fromY) {
  let best = null, bd = range;
  const ox = fromX === undefined ? v.x : fromX, oy = fromY === undefined ? v.y : fromY;
  for (const o of R.cars) {
    if (!isEnemy(v, o) || o.wrecked) continue;
    const dx = o.x - ox, dy = o.y - oy, d = Math.hypot(dx, dy);
    if (d > bd) continue;
    if (Math.abs(normA(Math.atan2(dy, dx) - base)) > cone) continue;
    if (!lineClear(R.T, ox, oy, o.x, o.y)) continue;   // can't shoot through buildings or walls
    best = o; bd = d;
  }
  return best;
}

// ---------------------------------------------------------------------------------------
function physics(v, dt) {
  const T = R.T;
  if (v.wrecked) {
    const k = Math.pow(0.12, dt); v.vx *= k; v.vy *= k;
    v.x += v.vx * dt; v.y += v.vy * dt;
    if (v.semi) updateTrailer(v);
    mapCollide(v, 12);
    if (v.wreckT < 12 && Math.random() < dt * 5) puff(v.x + rnd(-8, 8), v.y + rnd(-8, 8), 'darksmoke', 0.6);
    if (v.wreckT < 6 && Math.random() < dt * 12) puff(v.x + rnd(-6, 6), v.y + rnd(-6, 6), 'fire', 0.5);
    return;
  }
  const near = v.near;
  const offroad = T.kind === 'circuit' && near.dist > ROAD_HALF + 6;
  const blown = v.tire <= 0;
  const nitro = v.nitroT > 0;
  if (nitro) v.nitroT -= dt;
  if (v.oilT > 0) v.oilT -= dt;
  if (v.hitFlash > 0) v.hitFlash -= dt;
  // steering
  v.steerS = v.steerS === undefined ? 0 : v.steerS;
  v.steerS += clamp(v.steer - v.steerS, -dt * 7, dt * 7);
  const sp0 = Math.hypot(v.vx, v.vy);
  let fwd0 = v.vx * Math.cos(v.a) + v.vy * Math.sin(v.a);
  let turn = v.st.turn * (1 - Math.min(0.3, sp0 / 1900)) * clamp(Math.abs(fwd0) / 100, 0, 1) * (v.oilT > 0 ? 0.45 : 1) * (blown ? 0.8 : 1);
  v.a += v.steerS * turn * dt * (fwd0 < -5 ? -1 : 1);
  if (v.spin) { v.a += v.spin * dt; v.spin *= Math.exp(-2.5 * dt); if (Math.abs(v.spin) < 0.05) v.spin = 0; }
  const fx = Math.cos(v.a), fy = Math.sin(v.a);
  let vf = v.vx * fx + v.vy * fy, vl = -v.vx * fy + v.vy * fx;
  const top = v.st.top * (blown ? 0.7 : 1) * (offroad ? 0.58 : 1) * (nitro ? 1.42 : 1) * (v.rubber || 1) * ((v.isPlayer || v.human) ? 1 : AI_SPEED * (v.spdMul || 1));
  const acc = v.st.accel * (nitro ? 1.9 : 1) * (blown ? 0.7 : 1) * ((v.isPlayer || v.human) ? 1 : AI_SPEED * (v.spdMul || 1));
  if (v.brake) {
    const bk = v.brakeAmt === undefined ? 1 : Math.max(0.35, v.brakeAmt);
    if (vf > 15) vf -= 680 * bk * dt; else vf = Math.max(vf - 320 * bk * dt, -140);
  } else if (v.throttle > 0) {
    // partial throttle = slower acceleration and a lower cruising speed
    const tTop = top * (0.35 + 0.65 * v.throttle);
    if (vf < tTop) vf = Math.min(tTop, vf + acc * v.throttle * dt * (1 - Math.max(0, vf) / top * 0.55));
    else vf -= (vf - tTop) * 1.6 * dt;
  } else vf -= vf * 0.9 * dt;
  vf -= vf * 0.04 * dt;
  const grip = v.st.grip * (v.oilT > 0 ? 0.08 : 1) * (offroad ? 0.7 : 1) * (blown ? 0.6 : 1) * (T.themeKey === 'snow' ? 0.8 : 1);
  vl *= Math.exp(-grip * 7.5 * dt);
  v.vx = fx * vf - fy * vl; v.vy = fy * vf + fx * vl;
  v.x += v.vx * dt; v.y += v.vy * dt;
  if (v.semi) updateTrailer(v);
  mapCollide(v, 14);
  v.speed = Math.abs(vf); v.slip = Math.abs(vl);
  // skid marks + tyre smoke
  if ((Math.abs(vl) > 85 || (v.brake && vf > 120) || v.oilT > 0) && !offroad) addSkid(v);
  else v.skid = null;
  if (offroad && v.speed > 80 && Math.random() < dt * 30) puff(v.x - fx * v.L / 2 + rnd(-6, 6), v.y - fy * v.L / 2 + rnd(-6, 6), 'dust', 1);
  if (nitro && Math.random() < dt * 60) {
    const bx = v.x - fx * (v.L / 2 + 2), by = v.y - fy * (v.L / 2 + 2);
    R.parts.push({ x: bx + rnd(-3, 3), y: by + rnd(-3, 3), vx: -fx * 120 + v.vx * 0.6, vy: -fy * 120 + v.vy * 0.6, life: 0.25, max: 0.25, size: 5, grow: -8, type: 'nitro' });
  }
  // damage smoke / fire
  const hpFrac = v.struct / v.structMax;
  if (hpFrac < 0.55 && Math.random() < dt * (hpFrac < 0.3 ? 22 : 8)) puff(v.x + fx * v.L * 0.3, v.y + fy * v.L * 0.3, hpFrac < 0.25 ? 'darksmoke' : 'smoke', 0.8);
  if (v.burnT > 0) {
    v.burnT -= dt * (v.acc.ext ? 3 : 1);
    if (Math.random() < dt * 25) puff(v.x + rnd(-v.L / 3, v.L / 3), v.y + rnd(-6, 6), 'fire', 0.5);
    v.burnTick = (v.burnTick || 0) + dt;
    if (v.burnTick > 0.25) { v.burnTick = 0; damage(v, 0.3, v.x + rnd(-40, 40), v.y + rnd(-40, 40), v.burnBy, 'fire'); }
  }
  if (v.acc.drone) {
    v.droneT = (v.droneT || 0) + dt;
    if (v.droneT > 0.8) { v.droneT = 0; let lo = null; for (const f of FACINGS) if (v.armor[f] < v.armorMax[f] && (!lo || v.armor[f] / Math.max(1, v.armorMax[f]) < v.armor[lo] / Math.max(1, v.armorMax[lo]))) lo = f; if (lo) v.armor[lo] = Math.min(v.armorMax[lo], v.armor[lo] + 1); }
  }
  // engine sound follows the player
  if (v.isPlayer) SFX.engine(v.speed / Math.max(200, v.st.top), nitro, v.slip);
}

function mapCollide(v, win) {
  const T = R.T;
  if (T.kind === 'circuit') {
    v.near = nearestNear(T, v.x, v.y, v.near.i, win);
    wallCollide(v);
    computeCircles(v);
  } else {
    computeCircles(v);
    cityCollide(v, T);
  }
}

function computeCircles(v) {
  const c = Math.cos(v.a), s = Math.sin(v.a);
  v.wc.length = 0;
  for (const [ox, r] of v.circ) v.wc.push({ x: v.x + c * ox, y: v.y + s * ox, r, tr: false });
  if (v.semi) {
    const tc = Math.cos(v.semi.ta), ts = Math.sin(v.semi.ta);
    for (const [ox, r] of v.semi.circ) v.wc.push({ x: v.semi.cx + tc * ox, y: v.semi.cy + ts * ox, r, tr: true });
  }
}

function wallCollide(v) {
  const near = v.near, lim = WALL_D - v.W / 2 - 3;
  if (near.dist > lim) {
    const n = R.T.nrm[near.i], sg = Math.sign(near.lat);
    const ox = n[0] * sg, oy = n[1] * sg;
    const ex = near.dist - lim;
    v.x -= ox * ex; v.y -= oy * ex;
    const vn = v.vx * ox + v.vy * oy;
    if (vn > 0) {
      v.vx -= ox * vn * 1.35; v.vy -= oy * vn * 1.35;
      v.vx *= 0.96; v.vy *= 0.96;
      if (vn > 70 && !v.wrecked) {
        damage(v, (vn - 70) / 30, v.x + ox * 60, v.y + oy * 60, null, 'wall');
        sparks(v.x + ox * v.W / 2, v.y + oy * v.W / 2, 6);
        if (v.isPlayer || near.dist < 600) SFX.play('scrape', clamp(vn / 400, 0.2, 0.7));
      } else if (Math.random() < 0.3) sparks(v.x + ox * v.W / 2, v.y + oy * v.W / 2, 1);
    }
    v.near = nearestNear(R.T, v.x, v.y, near.i, 6);
  }
  if (v.semi) {
    const tn = nearestNear(R.T, v.semi.cx, v.semi.cy, v.near.i, 30);
    const tl = WALL_D - v.W / 2 - 3;
    if (tn.dist > tl) {
      const n = R.T.nrm[tn.i], sg = Math.sign(tn.lat), ex = tn.dist - tl;
      v.semi.rx -= n[0] * sg * ex * 1.6; v.semi.ry -= n[1] * sg * ex * 1.6;
      updateTrailer(v);
    }
  }
}

function collideCars() {
  const cs = R.cars;
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
    const a = cs[i], b = cs[j];
    // quick reject
    const reach = (a.semi ? 130 : 45) + (b.semi ? 130 : 45);
    if (Math.abs(a.x - b.x) > reach || Math.abs(a.y - b.y) > reach) continue;
    for (const ca of a.wc) for (const cb of b.wc) {
      const dx = cb.x - ca.x, dy = cb.y - ca.y, rr = ca.r + cb.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 0.0001) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, pen = rr - d;
      const ma = a.wrecked ? a.mass * 1.5 : a.mass, mb = b.wrecked ? b.mass * 1.5 : b.mass;
      const ta = mb / (ma + mb), tb = ma / (ma + mb);
      a.x -= nx * pen * ta; a.y -= ny * pen * ta; b.x += nx * pen * tb; b.y += ny * pen * tb;
      if (ca.tr) { a.semi.rx -= nx * pen * ta; a.semi.ry -= ny * pen * ta; }
      if (cb.tr) { b.semi.rx += nx * pen * tb; b.semi.ry += ny * pen * tb; }
      const vr = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (vr < 0) {
        const e = 0.25, jimp = -(1 + e) * vr / (1 / ma + 1 / mb);
        a.vx -= jimp / ma * nx; a.vy -= jimp / ma * ny;
        b.vx += jimp / mb * nx; b.vy += jimp / mb * ny;
        const impact = -vr;
        if (impact > 90) {
          const cx = (ca.x + cb.x) / 2, cy = (ca.y + cb.y) / 2;
          let da = (impact - 90) / 20 * ta, db = (impact - 90) / 20 * tb;
          // ram plate: front hits deal more, take less
          if (a.acc.ram && facingOf(a, cx, cy, ca.tr) === 'F') { db *= 1.7; da *= 0.4; }
          if (b.acc.ram && facingOf(b, cx, cy, cb.tr) === 'F') { da *= 1.7; db *= 0.4; }
          if (isEnemy(a, b)) { damage(a, da, cx, cy, b, 'ram', ca.tr); damage(b, db, cx, cy, a, 'ram', cb.tr); }
          sparks(cx, cy, Math.min(14, 3 + impact / 30));
          if (a.isPlayer || b.isPlayer) { SFX.play('crash', clamp(impact / 500, 0.25, 1)); R.shake = Math.min(10, R.shake + impact / 60); }
        }
      }
      computeCircles(a); computeCircles(b);
    }
  }
  for (const v of cs) if (v.semi) updateTrailer(v);
}

// ---------------------------------------------------------------------------------------
function facingOf(v, sx, sy, onTrailer) {
  let base = v.a, px = v.x, py = v.y;
  if (onTrailer && v.semi) { base = v.semi.ta; px = v.semi.cx; py = v.semi.cy; }
  const rel = normA(Math.atan2(sy - py, sx - px) - base);
  const ar = Math.abs(rel);
  return ar < Math.PI / 4 ? 'F' : ar > Math.PI * 0.75 ? 'B' : rel > 0 ? 'R' : 'L';
}

function damage(v, amt, sx, sy, by, kind, onTrailer) {
  if (v.wrecked || amt <= 0 || (R.over && v.finished)) return;
  if (v.finished) amt *= 0.3;
  if (R.mode !== 'race' && kind !== 'ram' && kind !== 'wall') amt *= BATTLE_DMG;
  if (by && !by.isPlayer && !by.human && by.dmgMul && kind !== 'wall') amt *= by.dmgMul;
  if (R.hunt && v.isPlayer && by && !by.isPlayer) amt *= 0.7;   // All vs You: everyone's shooting at you, so each hit counts a bit less
  const f = facingOf(v, sx, sy, onTrailer);
  const am = v.armorHp;
  const cap = v.armor[f] * am;
  if (cap >= amt) v.armor[f] -= amt / am;
  else {
    const over = amt - cap; v.armor[f] = 0;
    v.struct -= over;
    if (Math.random() < 0.25) v.tire = Math.max(0, v.tire - over * 0.6);
  }
  if (by && by !== v) v.lastBy = by;
  v.hitFlash = 0.1;
  if (v.isPlayer && kind !== 'fire') { R.shake = Math.min(9, R.shake + amt * 0.22); vibrate(amt > 12 ? 45 : 12); }
  if (v.struct <= 0) wreck(v, by || v.lastBy);
}

function tireDamage(v, amt) {
  if (v.wrecked) return;
  if (v.car.tires && TIRES[v.car.tires].spikeResist) amt *= 0.3;
  const was = v.tire > 0;
  v.tire = Math.max(0, v.tire - amt);
  if (was && v.tire <= 0) { msg(v.name + (v.isPlayer ? ': tire blown!' : ' blew a tire'), v.isPlayer ? '#ff8a65' : '#ccc'); SFX.play('pop'); }
}

function wreck(v, by) {
  v.wrecked = true; v.wreckT = 0; v.struct = 0; v.outT = R.t;
  explosion(v.x, v.y, 1.6);
  if (v.semi) explosion(v.semi.cx, v.semi.cy, 1.2);
  SFX.at('wreck', v.x, v.y, 1);
  if (by && by !== v) {
    by.kills++;
    msg(by.name + ' wrecked ' + v.name + '!', by.isPlayer ? '#ffd54f' : v.isPlayer ? '#ff6e6e' : '#ddd', true);
    if (by.isPlayer) SFX.play('kill');
  } else msg(v.name + ' is out!', v.isPlayer ? '#ff6e6e' : '#ddd', true);
  if (v.isPlayer) { R.shake = 14; if (R.teams && R.cars.some(o => o.ally && !o.wrecked)) msg('You are out! Your team fights on.', '#8fe388'); }
}

function msg(text, col, share) {
  R.msgs.push({ text, col: col || '#fff', t: 3 }); if (R.msgs.length > 4) R.msgs.shift();
  if (share && R.netHost) netEvent('m', text);   // multiplayer: other phones see it too
}

// ---------------------------------------------------------------------------------------
function updateLap(v) {
  if (v.wrecked) return;
  const N = R.T.N, i = v.near.i, prev = v.idx;
  if (prev > N * 0.75 && i < N * 0.25) {
    if (v.halfway) {
      v.lap++; v.halfway = false;
      if (v.lap > R.laps && !v.finished) {
        v.finished = true; v.place = ++R.finishCount; v.finishT = R.t - R.goT;
        if (!v.isPlayer) msg(v.name + ' finished ' + ordinal(v.place), '#aaa', true);
      } else if (v.isPlayer && v.lap === R.laps && R.laps > 1) { msg('FINAL LAP!', '#ffd54f'); SFX.play('finallap'); }
      else if (v.isPlayer && v.lap > 1) SFX.play('lap');
    }
  } else if (prev < N * 0.25 && i > N * 0.75) { v.lap--; v.halfway = true; }
  if (i > N * 0.4 && i < N * 0.6) v.halfway = true;
  v.idx = i;
  v.prog = v.lap * N + i;
}

function ordinal(n) { return n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th'); }

// Survivors first (healthiest first if time ran out), then wrecked cars, last-wrecked first.
function raceStandings() {
  return R.cars.slice().sort((a, b) => {
    const ka = a.finished ? 0 : a.wrecked ? 2 : 1, kb = b.finished ? 0 : b.wrecked ? 2 : 1;
    if (ka !== kb) return ka - kb;
    if (ka === 0) return a.place - b.place;
    return b.prog - a.prog;
  });
}

function healthScore(v) { return v.struct + (v.armor.F + v.armor.B + v.armor.L + v.armor.R) * v.armorHp; }
function teamScore(team) { let s = 0; for (const v of R.cars) if (v.team === team && !v.wrecked) s += healthScore(v) + 1000; return s; }
function standings() {
  if (R.mode === 'race') return raceStandings();
  if (R.teams) {
    // the team with cars left (or the healthiest team at the time limit) ranks first
    const ts = { 0: teamScore(0), 1: teamScore(1) };
    const win = ts[0] >= ts[1] ? 0 : 1;
    const inTeam = (t) => R.cars.filter(v => v.team === t).sort((a, b) => (a.wrecked !== b.wrecked) ? (a.wrecked ? 1 : -1) : !a.wrecked ? healthScore(b) - healthScore(a) : (b.outT || 0) - (a.outT || 0));
    return inTeam(win).concat(inTeam(1 - win));
  }
  return R.cars.slice().sort((a, b) => {
    // All vs You: if you're still running at the end, you've won
    if (R.hunt && (a.isPlayer || b.isPlayer)) { const p = a.isPlayer ? a : b, o = a.isPlayer ? b : a; if (!p.wrecked && !o.wrecked) return a.isPlayer ? -1 : 1; }
    if (a.wrecked !== b.wrecked) return a.wrecked ? 1 : -1;
    if (!a.wrecked) return healthScore(b) - healthScore(a);
    return (b.outT || 0) - (a.outT || 0);
  });
}

// ---------------------------------------------------------------------------------------
//  Weapons
// ---------------------------------------------------------------------------------------
function turretWorld(v) {
  const tp = turretMountPos(v.car);
  if (tp.trailer && v.semi) { const [ox, oy] = rot(tp.x, tp.y, v.semi.ta); return { x: v.semi.cx + ox, y: v.semi.cy + oy, base: v.semi.ta }; }
  const [ox, oy] = rot(tp.x, tp.y, v.a); return { x: v.x + ox, y: v.y + oy, base: v.a };
}

function combat(v, dt) {
  for (const w of v.weapons) {
    w.cd -= dt;
    if (w.mount === 'turret') {
      const tw = turretWorld(v);
      const t = findTarget(v, 0, 9, w.def.range, tw.x, tw.y);
      w.tgt = t;
      let want = 0;
      if (t) { const lead = leadAngle(tw.x, tw.y, t, w.def.speed || 1e9); want = normA(lead - tw.base); }
      const d = normA(want - w.rel);
      w.rel += clamp(d, -dt * (v.acc.tgt ? 7 : 4.5), dt * (v.acc.tgt ? 7 : 4.5));
    }
  }
  // guided rockets: the player taps ROCKET then the target; the AI sends them at whoever it's fighting
  if (!v.isPlayer && !v.human && v.fire && R.t > R.goT) {
    for (const w of v.weapons) {
      if (w.def.cat !== 'guided' || w.cd > 0 || w.ammo <= 0) continue;
      const t = findTarget(v, v.a, Math.PI, w.def.range);
      if (!t) continue;
      const lead = 0.25 + Math.hypot(t.x - v.x, t.y - v.y) / w.def.speed * 0.6;
      fireGuided(v, w, t.x + t.vx * lead + rnd(-40, 40) * (1 - v.skill), t.y + t.vy * lead + rnd(-40, 40) * (1 - v.skill));
    }
  }
  if (v.fire) {
    for (const w of v.weapons) {
      if (w.def.cat === 'guided') continue;
      if (w.cd > 0 || w.ammo <= 0) continue;
      let ox, oy, ang;
      if (w.mount === 'front') {
        const n = w.n, ly = n === 1 ? 0 : (w.slot ? 1 : -1) * v.W * (v.semi ? 0.3 : 0.24);
        const [rx, ry] = rot(v.L / 2 + 3, ly, v.a); ox = v.x + rx; oy = v.y + ry;
        ang = v.a;
        const assist = ((v.isPlayer || v.human) ? 0.15 : 0.28) + (v.acc.tgt ? 0.08 : 0);
        const t = findTarget(v, v.a, assist + 0.15, w.def.range, ox, oy);
        if (t) { const la = leadAngle(ox, oy, t, w.def.speed || 1e9); const d = normA(la - v.a); if (Math.abs(d) < assist) ang = la; }
      } else {
        const tw = turretWorld(v);
        ang = tw.base + w.rel;
        if (w.tgt) { const la = leadAngle(tw.x, tw.y, w.tgt, w.def.speed || 1e9); if (Math.abs(normA(la - ang)) > 0.22) continue; }
        ox = tw.x + Math.cos(ang) * 10; oy = tw.y + Math.sin(ang) * 10;
      }
      const spreadExtra = (v.isPlayer || v.human) ? 0 : (1 - v.skill) * 0.14;
      const spread = (w.def.spread || 0) * (v.acc.tgt ? 0.5 : 1) + spreadExtra;
      fireShot(v, w, ox, oy, ang + rnd(-spread, spread));
      w.cd = 1 / w.def.rate;
      if (w.def.ammo) w.ammo--;
    }
  }
  if (v.drop) {
    for (const d of v.droppers) {
      d.cd -= dt;
      if (d.cd > 0 || d.uses <= 0) continue;
      const [rx, ry] = v.semi ? [v.semi.cx - Math.cos(v.semi.ta) * (v.semi.TL / 2 + 10) - v.x, v.semi.cy - Math.sin(v.semi.ta) * (v.semi.TL / 2 + 10) - v.y] : rot(-v.L / 2 - 12, 0, v.a);
      dropHazard(v, d.key, v.x + rx, v.y + ry);
      d.uses--; d.cd = d.def.cd;
    }
  } else for (const d of v.droppers) d.cd -= dt;
}

function leadAngle(ox, oy, t, spd) {
  const dx = t.x - ox, dy = t.y - oy, d = Math.hypot(dx, dy);
  const tt = d / spd;
  return Math.atan2(dy + t.vy * tt, dx + t.vx * tt);
}

// a car's sound: yours plays straight; others come from their spot on screen
function sfxFrom(v, name, mine, theirs) { if (v.isPlayer) SFX.play(name, mine); else SFX.at(name, v.x, v.y, theirs * 2.4); }
function fireShot(v, w, x, y, a) {
  const def = w.def, c = Math.cos(a), s = Math.sin(a);
  const near = v.isPlayer || Math.hypot(v.x - R.player.x, v.y - R.player.y) < 700;
  switch (def.cat) {
    case 'gun':
      R.proj.push({ k: 'bullet', x, y, vx: c * def.speed + v.vx, vy: s * def.speed + v.vy, life: def.range / def.speed, dmg: def.dmg, owner: v, r: 2, ni: v.near.i, heavy: w.key === 'hmg' });
      flash(x, y, a, 0.6);
      if (near) sfxFrom(v, w.key === 'hmg' ? 'hmg' : 'mg', 0.75, 0.3);
      break;
    case 'shell':
      R.proj.push({ k: 'shell', x, y, vx: c * def.speed + v.vx, vy: s * def.speed + v.vy, life: def.range / def.speed, dmg: def.dmg, splash: def.splash, owner: v, r: 3, ni: v.near.i });
      flash(x, y, a, 1.1);
      if (near) sfxFrom(v, 'cannon', 0.6, 0.3);
      break;
    case 'rocket':
      R.proj.push({ k: 'rocket', x, y, vx: c * def.speed * 0.5 + v.vx, vy: s * def.speed * 0.5 + v.vy, a, spd: def.speed, life: def.range / def.speed + 0.3, dmg: def.dmg, splash: def.splash, owner: v, r: 4, ni: v.near.i });
      if (near) sfxFrom(v, 'rocket', 0.6, 0.3);
      break;
    case 'missile': {
      const t = findTarget(v, a, 1.0, def.range);
      R.proj.push({ k: 'missile', x, y, vx: c * def.speed * 0.6 + v.vx, vy: s * def.speed * 0.6 + v.vy, a, spd: def.speed, life: def.range / def.speed + 0.8, dmg: def.dmg, splash: def.splash, owner: v, r: 4, tgt: t, ni: v.near.i });
      if (near) sfxFrom(v, 'rocket', 0.6, 0.3);
      break; }
    case 'flame':
      for (let i = 0; i < 2; i++) {
        const sp = def.speed * rnd(0.85, 1.15), aa = a + rnd(-0.08, 0.08);
        R.proj.push({ k: 'flame', x, y, vx: Math.cos(aa) * sp + v.vx, vy: Math.sin(aa) * sp + v.vy, life: def.range / def.speed, max: def.range / def.speed, dmg: def.dmg, owner: v, r: 7, ni: v.near.i });
      }
      if (near && Math.random() < 0.3) SFX.play('flame', v.isPlayer ? 0.35 : 0.15);
      break;
    case 'laser': {
      let ex = x + c * def.range, ey = y + s * def.range, hit = null;
      for (let d = 10; d < def.range; d += 8) {
        const px = x + c * d, py = y + s * d;
        if (R.T.kind === 'city' && mapBlocked(R.T, px, py)) { ex = px; ey = py; sparks(px, py, 2, '#8ff'); break; }
        for (const o of R.cars) {
          if (!isEnemy(v, o) || o.wrecked) continue;
          for (const cc of o.wc) if ((cc.x - px) ** 2 + (cc.y - py) ** 2 < cc.r * cc.r) { hit = { o, tr: cc.tr }; break; }
          if (hit) break;
        }
        if (hit) { ex = px; ey = py; break; }
      }
      if (hit) { damage(hit.o, def.dmg, x, y, v, 'laser', hit.tr); sparks(ex, ey, 3, '#8ff'); }
      R.beams.push({ x1: x, y1: y, x2: ex, y2: ey, t: 0.07 });
      if (near) sfxFrom(v, 'laser', 0.4, 0.2);
      break; }
    case 'rail':
      R.proj.push({ k: 'rail', x, y, vx: c * def.speed, vy: s * def.speed, life: def.range / def.speed, dmg: def.dmg, owner: v, r: 3, hitset: [], ni: v.near.i });
      flash(x, y, a, 1.2);
      if (near) sfxFrom(v, 'rail', 0.7, 0.35);
      break;
  }
}

// Launch a guided rocket from this weapon toward a spot on the map.
function fireGuided(v, w, tx, ty) {
  if (w.cd > 0 || w.ammo <= 0 || v.wrecked) return false;
  let ox, oy, a;
  if (w.mount === 'front') {
    const n = w.n, ly = n === 1 ? 0 : (w.slot ? 1 : -1) * v.W * (v.semi ? 0.3 : 0.24);
    const [rx, ry] = rot(v.L / 2 + 3, ly, v.a); ox = v.x + rx; oy = v.y + ry; a = v.a;
  } else { const tw = turretWorld(v); ox = tw.x; oy = tw.y; a = Math.atan2(ty - oy, tx - ox); w.rel = normA(a - tw.base); }
  // it leaves the launcher pointing ahead and curves round toward the target
  const d = Math.hypot(tx - ox, ty - oy), def = w.def;
  R.proj.push({ k: 'guided', x: ox, y: oy, vx: Math.cos(a) * def.speed * 0.5 + v.vx, vy: Math.sin(a) * def.speed * 0.5 + v.vy, a, spd: def.speed,
    life: Math.min(def.range, d) / def.speed + 2.2, dmg: def.dmg, splash: def.splash, owner: v, r: 4, tx, ty, ni: v.near.i });
  w.cd = 1 / def.rate; w.ammo--;
  const near = v.isPlayer || Math.hypot(v.x - R.player.x, v.y - R.player.y) < 700;
  if (near) sfxFrom(v, 'guided', 0.7, 0.3);
  return true;
}
// screen point (CSS pixels on the game canvas) -> map position
// switch camera view (button during a race, or Settings)
function cycleView() {
  const i = VIEW_ORDER.indexOf(S.view in VIEWS ? S.view : 'chase');
  S.view = VIEW_ORDER[(i + 1) % VIEW_ORDER.length]; S.viewSet = true; save();
  if (R && !R.done) { msg('View: ' + VIEWS[S.view].name, '#cfd8dc'); resizeGame(); R.cam.oy = curView().oy; }
  syncViewUI();
}
function syncViewUI() {
  const jb = document.getElementById('joybase'); if (jb) jb.classList.toggle('abs', !curView().rotate);
}
function curView() { return VIEWS[S && S.view] || VIEWS.chase; }
function screenToWorld(sx, sy) {
  const cam = R.cam, z = cam.z, th = cam.a + Math.PI / 2;
  const dx = (sx - R.w / 2) / z, dy = (sy - R.h * (cam.oy || 0.64)) / z;
  return [cam.x + dx * Math.cos(th) - dy * Math.sin(th), cam.y + dx * Math.sin(th) + dy * Math.cos(th)];
}
function playerGuided() { return R && R.player ? R.player.weapons.filter(w => w.def.cat === 'guided') : []; }
// ROCKET button: arm (or cancel); the next tap on the road picks the target
function toggleAim() {
  if (!R || R.done || R.paused || R.player.wrecked || R.t < R.goT) return;
  const ws = playerGuided(); if (!ws.length) return;
  if (!ws.some(w => w.ammo > 0)) { msg('Out of guided rockets', '#ffb74d'); return; }
  R.aim = !R.aim; R.aimT = 6; if (R.aim) SFX.play('aim');
}
function aimAt(sx, sy) {
  R.aim = false;
  const P = R.player;
  const w = playerGuided().filter(w => w.ammo > 0).sort((a, b) => a.cd - b.cd)[0];
  if (!w) return;
  const [tx, ty] = screenToWorld(sx, sy);
  if (R.net && !R.netHost) { netSend({ t: 'a', a: 'aim', x: Math.round(tx), y: Math.round(ty) }); R.aimMark = { x: tx, y: ty, t: 2.5 }; return; }
  // still reloading: remember the spot and launch the moment it's ready
  if (w.cd > 0) { R.aimQueued = { w, tx, ty }; return; }
  fireGuided(P, w, tx, ty);
}

function updateProjectiles(dt) {
  const T = R.T;
  const keep = [];
  for (const p of R.proj) {
    p.life -= dt;
    if (p.k === 'rocket' || p.k === 'missile' || p.k === 'guided') {
      if (p.k === 'missile' && p.tgt && !p.tgt.wrecked) {
        const want = Math.atan2(p.tgt.y - p.y, p.tgt.x - p.x);
        p.a += clamp(normA(want - p.a), -2.8 * dt, 2.8 * dt);
      }
      if (p.k === 'guided') {
        // fly to the spot that was tapped and blow up there
        const want = Math.atan2(p.ty - p.y, p.tx - p.x);
        p.a += clamp(normA(want - p.a), -4.6 * dt, 4.6 * dt);
        if (Math.hypot(p.tx - p.x, p.ty - p.y) < 28) p.life = 0;
      }
      const sp = Math.min(p.spd * 1.25, Math.hypot(p.vx, p.vy) + p.spd * 2 * dt);
      p.vx = Math.cos(p.a) * sp; p.vy = Math.sin(p.a) * sp;
      if (Math.random() < 0.9) R.parts.push({ x: p.x - p.vx * 0.012, y: p.y - p.vy * 0.012, vx: rnd(-15, 15), vy: rnd(-15, 15), life: 0.55, max: 0.55, size: 3.5, grow: 14, type: 'smoke' });
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    // hits
    let dead = false;
    for (const o of R.cars) {
      if (!isEnemy(p.owner, o) || o.wrecked) continue;   // no friendly fire
      if (p.hitset && p.hitset.indexOf(o) >= 0) continue;
      if (Math.abs(o.x - p.x) > 140 || Math.abs(o.y - p.y) > 140) continue;
      for (const cc of o.wc) {
        if ((cc.x - p.x) ** 2 + (cc.y - p.y) ** 2 < (cc.r + p.r) ** 2) {
          const sx = p.x - p.vx * 0.05, sy = p.y - p.vy * 0.05;
          if (p.k === 'flame') {
            damage(o, p.dmg, sx, sy, p.owner, 'fire', cc.tr);
            if (!o.acc.ext || Math.random() < 0.3) { o.burnT = Math.max(o.burnT, 2.2); o.burnBy = p.owner; }
            dead = true;
          } else if (p.k === 'rail') {
            damage(o, p.dmg, sx, sy, p.owner, 'rail', cc.tr); p.hitset.push(o); sparks(p.x, p.y, 8, '#9ef');
          } else {
            damage(o, p.dmg, sx, sy, p.owner, p.k, cc.tr);
            if (p.splash) blast(p.x, p.y, p.splash, p.dmg * 0.45, p.owner, o);
            else sparks(p.x, p.y, p.heavy ? 4 : 2);
            if (o.isPlayer) SFX.play('metal', 0.7); else if (p.owner.isPlayer) SFX.play('hit', 0.3);
            dead = true;
          }
          break;
        }
      }
      if (dead) break;
    }
    if (!dead) {
      let blocked;
      if (T.kind === 'circuit') { p.ni = nearestNear(T, p.x, p.y, p.ni, 8).i; blocked = nearestNear(T, p.x, p.y, p.ni, 3).dist > WALL_D + 4; }
      else blocked = mapBlocked(T, p.x, p.y);
      if (blocked) {
        if (p.splash) blast(p.x, p.y, p.splash, p.dmg * 0.45, p.owner, null);
        else if (p.k !== 'flame') sparks(p.x, p.y, 2);
        dead = true;
      }
    }
    if (!dead && p.life <= 0) {
      if (p.splash && (p.k === 'rocket' || p.k === 'missile')) blast(p.x, p.y, p.splash, p.dmg * 0.45, p.owner, null);
      else if (p.k === 'guided') blast(p.x, p.y, p.splash * 1.25, p.dmg * 0.75, p.owner, null);   // arrived: a full blast on the spot
      dead = true;
    }
    if (!dead) keep.push(p);
  }
  R.proj = keep;
  for (const b of R.beams) b.t -= dt;
  R.beams = R.beams.filter(b => b.t > 0);
}

function blast(x, y, radius, dmg, owner, skip) {
  explosion(x, y, radius / 40);
  const dP = Math.hypot(R.player.x - x, R.player.y - y);
  if (dP < 1300) SFX.at('boom', x, y, Math.min(1.1, radius / 45));
  if (dP < 300) R.shake = Math.min(10, R.shake + radius / 12);
  for (const o of R.cars) {
    if (o === skip || o.wrecked || (owner && !isEnemy(owner, o))) continue;
    const d = Math.hypot(o.x - x, o.y - y) - o.W / 2;
    if (d < radius) damage(o, dmg * (1 - Math.max(0, d) / radius), x, y, owner, 'blast');
  }
}

// ---------------------------------------------------------------------------------------
//  Droppers / hazards
// ---------------------------------------------------------------------------------------
function dropHazard(v, key, x, y) {
  const base = { owner: v, t: 0, hit: [] };
  const near = Math.hypot(R.player.x - x, R.player.y - y) < 600;
  switch (key) {
    case 'oil': R.haz.push(Object.assign(base, { type: 'oil', x, y, r: 34, life: 22, seed: Math.random() })); if (near) SFX.play('splat', 0.5); break;
    case 'spk': R.haz.push(Object.assign(base, { type: 'spk', x, y, r: 30, life: 22, a: v.a + Math.PI / 2 })); if (near) SFX.play('clank', 0.5); break;
    case 'smk': R.haz.push(Object.assign(base, { type: 'smoke', x, y, r: 30, life: 6.5, vx: v.vx * 0.15, vy: v.vy * 0.15 })); if (near) SFX.play('hiss', 0.5); break;
    case 'mine': R.haz.push(Object.assign(base, { type: 'mine', x, y, r: 12, life: 30, dmg: DROPPERS.mine.dmg })); if (near) SFX.play('clank', 0.4); break;
    case 'cmine':
      for (let i = 0; i < 3; i++) R.haz.push(Object.assign({ owner: v, t: 0, hit: [] }, { type: 'mine', x: x + rnd(-40, 40), y: y + rnd(-40, 40), r: 11, life: 30, dmg: DROPPERS.cmine.dmg }));
      if (near) SFX.play('clank', 0.5); break;
    case 'nap': R.haz.push(Object.assign(base, { type: 'nap', x, y, r: 44, life: 7.5 })); if (near) SFX.play('flame', 0.6); break;
  }
}

function updateHazards(dt) {
  const keep = [];
  for (const h of R.haz) {
    h.life -= dt; h.t += dt;
    if (h.type === 'smoke') { h.r = Math.min(120, h.r + dt * 45); h.x += h.vx * dt; h.y += h.vy * dt; }
    if (h.type === 'nap' && Math.random() < dt * 30) puff(h.x + rnd(-h.r, h.r) * 0.7, h.y + rnd(-h.r, h.r) * 0.7, 'fire', 0.8);
    let gone = h.life <= 0;
    if (!gone && h.type !== 'smoke') {
      for (const v of R.cars) {
        if (v.wrecked) continue;
        if (v === h.owner && h.t < 1.6) continue;
        if (h.owner && v !== h.owner && !isEnemy(h.owner, v)) continue;   // teammates' hazards don't hurt you
        let inside = false;
        for (const cc of v.wc) if ((cc.x - h.x) ** 2 + (cc.y - h.y) ** 2 < (cc.r + h.r) ** 2) { inside = true; break; }
        if (!inside) continue;
        if (h.type === 'oil' && h.hit.indexOf(v) < 0) { h.hit.push(v); v.oilT = 1.3; v.spin = rnd(-1, 1) * (1.4 + Math.random()); if (v.isPlayer) { SFX.play('skid', 0.6); msg('Oil slick!', '#bbb'); } }
        else if (h.type === 'spk' && h.hit.indexOf(v) < 0) { h.hit.push(v); tireDamage(v, 14); sparks(v.x, v.y, 4); if (v.isPlayer) SFX.play('pop', 0.5); }
        else if (h.type === 'mine' && h.t > 0.6) {
          damage(v, h.dmg, h.x, h.y, h.owner, 'mine'); tireDamage(v, 8);
          blast(h.x, h.y, 50, h.dmg * 0.4, h.owner, v);
          v.vx += rnd(-60, 60); v.vy += rnd(-60, 60); v.spin = rnd(-1.5, 1.5);
          gone = true; break;
        }
        else if (h.type === 'nap') {
          v.burnT = Math.max(v.burnT, 1.5); v.burnBy = h.owner;
          h.tick = (h.tick || 0) + dt;
          if (h.tick > 0.2) { h.tick = 0; damage(v, 0.5, v.x + rnd(-30, 30), v.y + rnd(-30, 30), h.owner, 'fire'); }
        }
      }
    }
    if (!gone) keep.push(h);
  }
  R.haz = keep;
}

// ---------------------------------------------------------------------------------------
//  Pickups: ammo and repair crates appear around the map
// ---------------------------------------------------------------------------------------
function spawnPickup(type) {
  const [x, y] = randomFreePoint(R.T, R.cars.filter(v => !v.wrecked), 260);
  R.pickups.push({ x, y, type: type || (Math.random() < 0.55 ? 'ammo' : 'repair'), t: 0 });
}
function updatePickups(dt) {
  R.pickT -= dt;
  if (R.pickT <= 0) { if (R.pickups.length < 4) spawnPickup(); R.pickT = rnd(9, 14); }
  for (const pk of R.pickups) pk.t += dt;
  R.pickups = R.pickups.filter(pk => {
    for (const v of R.cars) {
      if (v.wrecked || Math.hypot(v.x - pk.x, v.y - pk.y) > v.W / 2 + 20) continue;
      if (pk.type === 'ammo') {
        for (const w of v.weapons) w.ammo = w.def.ammo || Infinity;
        for (const d of v.droppers) d.uses = Math.min(d.def.uses, d.uses + 2);
        if (v.isPlayer) { msg('Ammo refilled!', '#ffca28'); SFX.play('reload'); }
      } else {
        for (const f of FACINGS) v.armor[f] = Math.min(v.armorMax[f], v.armor[f] + Math.ceil(v.armorMax[f] * 0.25));
        v.struct = Math.min(v.structMax, v.struct + v.structMax * 0.2); v.tire = v.tireMax;
        if (v.isPlayer) { msg('Repaired!', '#9ccc65'); SFX.play('repair'); }
      }
      return false;
    }
    return true;
  });
}

function drawPickup(c, pk) {
  const bob = Math.sin(pk.t * 4) * 2, s = 1 + Math.min(1, pk.t * 3) * 0 ;
  c.save(); c.translate(pk.x, pk.y);
  const col = pk.type === 'ammo' ? '#ffb300' : '#43a047';
  const g = c.createRadialGradient(0, 0, 4, 0, 0, 34);
  g.addColorStop(0, rgba(col, 0.45)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 34, 0, 6.3); c.fill();
  c.rotate(pk.t * 0.8);
  c.fillStyle = 'rgba(0,0,0,0.35)'; rrect(c, -11 + 3, -11 + 4 + bob, 22, 22, 3); c.fill();
  c.fillStyle = pk.type === 'ammo' ? '#6b5a2a' : '#e9ecef'; rrect(c, -11, -11 + bob, 22, 22, 3); c.fill();
  c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = col;
  if (pk.type === 'ammo') { for (const x of [-5, 0, 5]) { rrect(c, x - 1.6, -6 + bob, 3.2, 12, 1.5); c.fill(); } }
  else { c.fillRect(-2.5, -8 + bob, 5, 16); c.fillRect(-8, -2.5 + bob, 16, 5); }
  c.restore();
}

// ---------------------------------------------------------------------------------------
//  Boosts (player buttons)
// ---------------------------------------------------------------------------------------
function boostAvailable(kind) {
  const P = R && R.player; if (!P) return 0;
  const left = Math.max(0, Math.min(BOOST_LIMIT_PER_RACE - P.bst.used[kind], S.boosts[kind]));
  return (kind === 'nitro' ? P.bst.freeNitro : 0) + left;
}

function useBoost(kind) {
  if (!R || R.paused || R.t < R.goT || R.over) return;
  const P = R.player;
  if (P.wrecked || P.finished) return;
  if (kind === 'nitro') {
    if (P.nitroT > 0) return;
    if (P.bst.freeNitro > 0) P.bst.freeNitro--;
    else if (boostAvailable('nitro') > 0) { S.boosts.nitro--; P.bst.used.nitro++; save(); }
    else return noBoost(kind);
    if (R.net && !R.netHost) { netSend({ t: 'a', a: 'nitro' }); SFX.play('nitro'); P.nitroT = 2.6; }
    else useNitro(P);
  } else {
    if (boostAvailable(kind) <= 0) return noBoost(kind);
    S.boosts[kind]--; P.bst.used[kind]++; save();
    if (R.net && !R.netHost) { netSend({ t: 'a', a: kind }); msg(kind === 'repair' ? 'Repaired!' : 'Ammo refilled!', kind === 'repair' ? '#9ccc65' : '#ffca28'); SFX.play(kind === 'repair' ? 'repair' : 'reload'); }
    else if (kind === 'repair') { applyRepairKit(P); msg('Repaired!', '#9ccc65'); SFX.play('repair'); }
    else { for (const w of P.weapons) w.ammo = w.def.ammo || Infinity; for (const d of P.droppers) d.uses = d.def.uses; msg('Ammo refilled!', '#ffca28'); SFX.play('reload'); }
  }
  UI.updateBoostButtons();
}

function noBoost(kind) {
  const P = R.player;
  if (S.boosts[kind] > 0 && P.bst.used[kind] >= BOOST_LIMIT_PER_RACE) msg('Max ' + BOOST_LIMIT_PER_RACE + ' ' + BOOSTS[kind].name + ' per race', '#bbb');
  else msg('No ' + BOOSTS[kind].name + ' left. Get more in the Store.', '#bbb');
}

function useNitro(v) { v.nitroT = 2.6; if (v.isPlayer) { SFX.play('nitro'); vibrate(30); } }

function applyRepairKit(v) {
  for (const f of FACINGS) v.armor[f] = Math.min(v.armorMax[f], v.armor[f] + Math.ceil(v.armorMax[f] * 0.35));

// ---------------------------------------------------------------------------------------
//  Effects

function puff(x, y, type, scale) {

  if (type === 'fire') R.parts.push({ x, y, vx: rnd(-20, 20), vy: rnd(-20, 20), life: 0.5, max: 0.5, size: 6 * s, grow: 10, type: 'fire' });
  else if (type === 'dust') R.parts.push({ x, y, vx: rnd(-25, 25), vy: rnd(-25, 25), life: 0.9, max: 0.9, size: 7 * s, grow: 22, type: 'dust' });
  else R.parts.push({ x, y, vx: rnd(-15, 15), vy: rnd(-15, 15), life: 1.4, max: 1.4, size: 5 * s, grow: 16, type: type === 'darksmoke' ? 'darksmoke' : 'smoke' });
}
function sparks(x, y, n, col) {
  for (let i = 0; i < n && R.parts.length < 800; i++) {
    const a = Math.random() * 6.283, sp = rnd(80, 320);
    R.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.12, 0.3), max: 0.3, size: 1.4, grow: 0, type: 'spark', col: col || '#ffd27a' });

}
function flash(x, y, a, s) { R.parts.push({ x: x + Math.cos(a) * 4, y: y + Math.sin(a) * 4, vx: 0, vy: 0, life: 0.05, max: 0.05, size: 6 * s, grow: 0, type: 'flash', a }); }
function explosion(x, y, s) {
  s = s || 1;
  if (R.netHost) netEvent('x', Math.round(x), Math.round(y), Math.round(s * 100) / 100);
  for (let i = 0; i < 16 * s && R.parts.length < 820; i++) {
    const a = Math.random() * 6.283, sp = rnd(30, 150) * s;
    R.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.7), max: 0.7, size: rnd(6, 12) * s, grow: 20, type: 'fire' });
  }

    const a = Math.random() * 6.283, sp = rnd(10, 60) * s;
    R.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.9, 1.6), max: 1.6, size: rnd(6, 10) * s, grow: 12, type: 'darksmoke' });

    R.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.4, 0.9), max: 0.9, size: rnd(1.5, 3), grow: 0, type: 'debris', rot: Math.random() * 6 });
  }

}

function updateParticles(dt) {
  const keep = [];
  for (const p of R.parts) {
    p.life -= dt;
    if (p.life <= 0) continue;
    const drag = p.type === 'spark' || p.type === 'debris' ? 3 : 1.5;
    p.vx *= Math.exp(-drag * dt); p.vy *= Math.exp(-drag * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.size = Math.max(0.5, p.size + p.grow * dt);
    if (p.type === 'debris') p.rot += dt * 10;
    keep.push(p);
  }
  R.parts = keep;
}

function addSkid(v) {
  const c = Math.cos(v.a), s = Math.sin(v.a);
  const bx = v.x - c * v.L * 0.32, by = v.y - s * v.L * 0.32;
  const wx = -s * (v.W / 2 - 3), wy = c * (v.W / 2 - 3);
  const l = [bx + wx, by + wy], r = [bx - wx, by - wy];
  if (v.skid) {
    R.skids.push([v.skid[0][0], v.skid[0][1], l[0], l[1]], [v.skid[1][0], v.skid[1][1], r[0], r[1]]);
    if (R.skids.length > 700) R.skids.splice(0, 2);
  }
  v.skid = [l, r];
  if (Math.random() < 0.35) R.parts.push({ x: bx, y: by, vx: rnd(-10, 10), vy: rnd(-10, 10), life: 0.8, max: 0.8, size: 5, grow: 16, type: 'tiresmoke' });
}

// ---------------------------------------------------------------------------------------
//  Rendering
// ---------------------------------------------------------------------------------------
// The world is drawn on #game; the HUD on #hud on top.
// Angled 3D view: #game is drawn bigger than the screen and tilted back with a CSS
// perspective transform (pivoting on the bottom edge), so the road runs off to a horizon.
function resizeGame() {
  const cv = document.getElementById('game'), hud = document.getElementById('hud'), app = document.getElementById('app');
  const sw = app.clientWidth, sh = app.clientHeight;
  const vw = curView();
  const full = Math.min(window.devicePixelRatio || 1, 2.5);
  let w = sw, h = sh, dpr = full, tilt = null;
  if (vw.tilt) {
    w = sw * 2; h = sh * 2.2; dpr = Math.min(full, 1.25);
    const th = vw.tilt * Math.PI / 180;
    tilt = { c: Math.cos(th), s: Math.sin(th), d: sh * 1.3, w, h, sw, sh };
    Object.assign(cv.style, { width: w + 'px', height: h + 'px', left: ((sw - w) / 2) + 'px', top: (sh - h) + 'px', transformOrigin: '50% 100%', transform: 'perspective(' + tilt.d + 'px) rotateX(' + vw.tilt + 'deg)' });
  } else Object.assign(cv.style, { width: '', height: '', left: '', top: '', transformOrigin: '', transform: '' });
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  hud.width = Math.round(sw * full); hud.height = Math.round(sh * full);
  if (R) {
    R.dpr = dpr; R.w = w; R.h = h; R.sw = sw; R.sh = sh; R.hdpr = full; R.tilt = tilt; R.hud = hud.getContext('2d');
    // sky behind the tilted road
    app.style.background = tilt ? 'linear-gradient(180deg, ' + shade(R.T.theme.sky || '#9fc3dc', -0.15) + ', ' + (R.T.theme.sky || '#9fc3dc') + ' 70%)' : '';
  }
}
// canvas point (drawing space of #game) <-> screen point, through the tilt
function canvasToScreen(x, y) {
  const t = R.tilt; if (!t) return [x, y];
  const u = y - t.h, k = t.d / (t.d - u * t.s);
  return [t.sw / 2 + (x - t.w / 2) * k, t.sh + u * t.c * k];
}
function screenToCanvas(X, Y) {
  const t = R.tilt; if (!t) return [X, Y];
  const yr = Y - t.sh, u = yr * t.d / (t.c * t.d + yr * t.s), k = t.d / (t.d - u * t.s);
  return [t.w / 2 + (X - t.sw / 2) / k, t.h + u];
}

function raceAudio(dt) {
  const P = R.player;
  // warning beeps when your frame is nearly gone
  R.alarmT = (R.alarmT || 0) - dt;
  if (!P.wrecked && !R.over && R.t > R.goT && P.struct < P.structMax * 0.22 && R.alarmT <= 0) { SFX.play('alarm'); R.alarmT = 1.4; }
  // hear the closest car's engine, from its side of the screen
  let best = null, bd = 1e9;
  for (const v of R.cars) { if (v === P || v.wrecked) continue; const d = Math.hypot(v.x - P.x, v.y - P.y); if (d < bd) { bd = d; best = v; } }
  if (best) {
    const th = -(R.cam.a + Math.PI / 2), dx = best.x - R.cam.x, dy = best.y - R.cam.y;
    SFX.rivalEngine(Math.hypot(best.vx, best.vy) / Math.max(200, best.st.top), bd, (dx * Math.cos(th) - dy * Math.sin(th)) / 400, ({ semi: 0.66, dually: 0.8, pickup: 0.85, suv: 0.85, sports: 1.15, supercar: 1.28, compact: 1.12 })[best.car.body] || 1);
  } else SFX.rivalEngine(0, 9999, 0, 1);
}
function renderRace(dt) {
  raceAudio(dt);

  cam.oy = (cam.oy || vw.oy) + (vw.oy - (cam.oy || vw.oy)) * (1 - Math.exp(-dt * 5));
  const sp = Math.hypot(tgt.vx, tgt.vy);
  const baseZ = clamp(Math.min(R.sw / 330, R.sh / 640), 0.7, 1.9) * (P.semi ? 0.85 : 1);
  const wantZ = baseZ * vw.zoom * (1 - Math.min(0.12, sp / 3500));

  c.scale(z, z);
  c.rotate(-cam.a - Math.PI / 2);
  c.translate(-cam.x, -cam.y);
  const view = { x: cam.x, y: cam.y, r: Math.hypot(W, H) / z };
  R.view = view;
  if (R.T.kind === 'city') drawCity(c, R.T, view); else drawTrack(c, R.T, view);
  // skid marks
  c.strokeStyle = 'rgba(15,15,15,0.35)'; c.lineWidth = 3.2; c.lineCap = 'round';
  c.beginPath();
  for (const s of R.skids) { c.moveTo(s[0], s[1]); c.lineTo(s[2], s[3]); }

  c.fillStyle = 'rgba(0,0,0,0.32)';
  for (const v of R.cars) {
    if (Math.abs(v.x - view.x) > view.r || Math.abs(v.y - view.y) > view.r) continue;
    c.save(); c.translate(v.x + sx, v.y + sy); c.rotate(v.a); rrect(c, -v.L / 2, -v.W / 2, v.L, v.W, 6); c.fill(); c.restore();

  }
  // vehicles
  for (const v of R.cars) {
    if (Math.abs(v.x - view.x) > view.r || Math.abs(v.y - view.y) > view.r) continue;
    drawSpr(c, v.wrecked ? v.spr.bodyWreck : v.spr.body, v.x, v.y, v.a);
    if (v.semi) drawSpr(c, v.wrecked ? v.spr.trailerWreck : v.spr.trailer, v.semi.cx, v.semi.cy, v.semi.ta);
    for (const w of v.weapons) if (w.mount === 'turret') { const tw = turretWorld(v); c.save(); c.translate(tw.x, tw.y); c.rotate(tw.base); drawTurret(c, v.wrecked ? null : w.key, 0, 0, w.rel, v.W); c.restore(); }
    if (v.hitFlash > 0 && !v.wrecked) {
      c.save(); c.globalAlpha = 0.35; c.globalCompositeOperation = 'lighter';
      c.translate(v.x, v.y); c.rotate(v.a); c.fillStyle = '#fff'; rrect(c, -v.L / 2, -v.W / 2, v.L, v.W, 6); c.fill(); c.restore();
    }
  }

  // where your guided rockets are heading
  const reticle = (x, y, col) => {
    const k = 1 / R.cam.z, r = 20 + Math.sin(R.t * 10) * 3;
    c.strokeStyle = col; c.lineWidth = 3 * k;
    c.beginPath(); c.arc(x, y, r, 0, 6.3); c.stroke();
    c.beginPath(); c.moveTo(x - r - 8, y); c.lineTo(x - r + 6, y); c.moveTo(x + r - 6, y); c.lineTo(x + r + 8, y); c.moveTo(x, y - r - 8); c.lineTo(x, y - r + 6); c.moveTo(x, y + r - 6); c.lineTo(x, y + r + 8); c.stroke();
  };
  for (const p of R.proj) if (p.k === 'guided' && p.owner === R.player) reticle(p.tx, p.ty, 'rgba(255,143,31,0.95)');
  if (R.aimQueued) reticle(R.aimQueued.tx, R.aimQueued.ty, 'rgba(255,255,255,0.8)');
  if (R.aimMark && R.aimMark.t > 0) reticle(R.aimMark.x, R.aimMark.y, 'rgba(255,143,31,0.95)');
  // laser beams
  c.lineCap = 'round';
  for (const b of R.beams) {
    c.strokeStyle = 'rgba(80,240,255,0.35)'; c.lineWidth = 6; c.beginPath(); c.moveTo(b.x1, b.y1); c.lineTo(b.x2, b.y2); c.stroke();
    c.strokeStyle = '#e8ffff'; c.lineWidth = 1.8; c.stroke();
  }
  drawParticles(c);
  // smoke clouds on top
  for (const h of R.haz) if (h.type === 'smoke') {
    const a = Math.min(1, h.life / 1.5) * 0.85;
    for (let i = 0; i < 7; i++) {
      const ang = i * 0.9 + h.t * 0.3, rr = h.r * (0.45 + (i % 3) * 0.18);
      c.fillStyle = 'rgba(205,205,205,' + (a * 0.45).toFixed(3) + ')';
      c.beginPath(); c.arc(h.x + Math.cos(ang) * h.r * 0.35, h.y + Math.sin(ang) * h.r * 0.35, rr, 0, 6.3); c.fill();
    }
  }
  // targeting: where your front guns point, and what they're locked on to

  // 3D buildings stand up after the cars, so cars behind them are hidden

  // name tags (screen-aligned, on the HUD layer)
